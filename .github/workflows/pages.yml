name: Deploy showcase to GitHub Pages

# Manual-only: when Pages source is "Deploy from a branch", GitHub rebuilds
# the site on every push to that branch automatically. Keep this workflow as
# a manual fallback (Actions → Run workflow) if the "GitHub Actions" source
# is ever selected instead.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable GitHub Pages (first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site (player page + demo renders)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
