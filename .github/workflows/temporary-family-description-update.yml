name: One-time approved Family Short description update
on:
  push:
    branches: ["arena/b0072173-youtube-automation"]
    paths: [".github/workflows/temporary-family-description-update.yml"]
permissions:
  contents: read
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check identity and apply the approved descriptions once
        env:
          CLIENT_ID: ${{ secrets.PRAYER5_YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PRAYER5_YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.PRAYER5_YOUTUBE_REFRESH_TOKEN }}
          EXPECTED_CHANNEL: ${{ vars.PRAYER5_YOUTUBE_CHANNEL_ID || secrets.PRAYER5_YOUTUBE_CHANNEL_ID }}
        run: python3 scripts/_temporary_family_description_update.py
      - name: Keep the pre-update public metadata for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-short-metadata-before-${{ github.run_id }}
          path: family-short-metadata-before.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record verified replacement on the incident
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/issues/382/comments" -f body="The owner approved replacement descriptions. Run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} verified the new English, Spanish and Portuguese descriptions on the existing public Short, while preserving title, tags, category, languages, localization titles, other localizations and privacy. These are replacements, not a claimed restoration of the unknown original metadata. Pre-update public metadata is retained as a run artifact for 30 days. The recovered-receipt automatic metadata hold remains in place." > /dev/null
