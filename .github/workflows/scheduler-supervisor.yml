# Dispatches whatever the scheduler dropped.
#
# The monitor compares each workflow's last *edit* with its last *run*, and on
# 2 November that comparison showed the crons themselves were not firing: the
# brain's 03:14 slot and keepalive's 03:23 slot both came and went with no run.
# A dropped schedule cannot report itself, so something else has to look.
#
# Every fifteen minutes this checks each workflow's most recent scheduled slot and
# dispatches the ones that produced no run — once per slot, at most three per pass.
name: Scheduler supervisor

# Triggers matter more than the logic here. On the morning of 2 November the
# scheduled triggers stopped firing repo-wide — monitor.yml, merged two hours before
# its 06:23 UTC slot, produced no run at all — while push-triggered CI started within
# seconds. So this supervisor must not depend on the scheduler it is meant to
# supervise: it also runs on every push to main and whenever any publishing workflow
# finishes, which is exactly when a catch-up pass is worth having.
on:
  schedule:
    # Eight spread-out passes, not `*/15`. Measured over 1-6 November: this repo asks
    # GitHub for ~150 cron events a day and receives a handful, 1-8 hours late. The
    # `*/15` cron asked for 96 of them and was delivered ~4 times a day, at random
    # hours — including not at all between 02:52 and 07:52 on 5-6 November, when the
    # night's whole schedule went unserved. Workflows that ask for a *few* crons get
    # every one of them (comments 3/3, produce 3/3, brain 1/1 over the same window),
    # so the honest request is a few well-placed slots, each of which recovers
    # everything overdue at that moment.
    - cron: "47 0,3,6,9,12,15,18,21 * * *"
  push:
    branches: [main]
  workflow_run:
    # No schedule needed to reach these: each one completing is a chance to notice
    # that something else did not.
    workflows:
      - "Produce video"
      - "Autonomous Comment Replies"
      - "Autonomous Community Tab Automation"
      - "Gemini Brain Autonomous Queue Replenishment"
      - "Keepalive"
      - "Automation monitor"
      # CI is the one workflow that demonstrably starts within seconds of every
      # push and every pull request — it ran at 10:01 today while this supervisor's
      # own push trigger and its 10:00/10:15 schedule slots produced nothing. Riding
      # CI gives the supervisor a chance every time CI does, on any branch.
      - "Dry-run pipeline (CI proof)"
      - "pages build and deployment"
      # Every other timer in this repo. Each completion is a free chance to notice a
      # slot that never started, and completions keep happening even when cron
      # delivery does not — the night of 5-6 November had none precisely because
      # nothing at all was running, which is the case eight crons above are for.
      - "Weekly metrics snapshot"
      - "Growth autopilot"
      - "Set video thumbnail (validated studio)"
      - "Validate prayer speech alignment"
      - "Expand the script queue"
    types: [completed]
  # An external tick, because every other trigger can be suppressed by the very
  # failure this watches for. Today's crons have not fired since 18:05 UTC, and a
  # wedged produce run never emits the `workflow_run` completion this relies on —
  # so the supervisor can be silent exactly when it is needed. One POST always
  # wakes it:
  #
  #   gh api --method POST repos/johnAzani/YouTube-automation/dispatches \
  #          -f event_type=watchdog-tick
  repository_dispatch:
    types: [watchdog-tick]
  workflow_dispatch:

permissions:
  contents: write    # records the dispatched-slot ledger
  actions: write     # the whole point: dispatch another workflow
  issues: read

# Never share the publish lock. On 2 November a wedged produce run held
# `content-state` for hours, so this watcher queued behind the exact run it was
# supposed to notice — the failure it exists to catch, from the inside. A watcher
# that can be blocked by what it watches is not a watcher.
concurrency:
  group: scheduler-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Dispatch missed slots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.scheduler_supervisor

      - name: Record the dispatch ledger
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "scheduler-supervisor"
          git config user.email "actions@users.noreply.github.com"
          # The ledger records what was dispatched; schedule-health.json records how
          # quiet the repo was and how late each delivery arrived. Both belong in the
          # history: a night nobody can measure is a night nobody can fix.
          for f in content/monitor/dispatched.json content/monitor/schedule-health.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m "chore(monitor): record dispatched slots and scheduler health [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push || echo "::warning::could not push the dispatch ledger"
          else
            echo "no dispatches and no schedule change this pass"
          fi
