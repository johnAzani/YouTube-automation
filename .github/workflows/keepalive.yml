name: Keepalive

# Protects the studio from two silent killers (docs/DEEP_DIVE.md §1):
#  1. GitHub auto-disables scheduled workflows in PUBLIC repos after 60 days
#     without repository activity. Only pushes reliably reset the timer.
#  2. A workflow disabled by GitHub for inactivity needs re-enabling.
#
# This workflow: (a) re-enables workflows disabled by inactivity (self-heal),
# while respecting manual pauses, and (b) commits a timestamp file when the last
# commit is aging (resets the clock).
# Never delete this workflow.

on:
  schedule:
    - cron: "23 3 * * 1"   # weekly self-heal (Mondays 4:23am Nigeria time = 03:23 UTC)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Re-enable every workflow (self-heal)
        # Recover only GitHub's inactivity disablement. A workflow disabled by
        # the owner is an intentional pause and must never be silently re-enabled.
        # Discover dynamically so newly added workflows are covered too.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          mapfile -t FILES < <(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "disabled_inactivity") | .path' \
            | sed 's|^.github/workflows/||' | sort)
          echo "found ${#FILES[@]} inactivity-disabled workflow(s): ${FILES[*]}"
          failed=0
          for wf in "${FILES[@]}"; do
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/enable" >/dev/null 2>&1; then
              echo "  enabled $wf"
            else
              echo "  could not enable $wf"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed workflow(s) could not be re-enabled by this token"
          fi

      - name: Commit timestamp if repo activity is aging (resets 60-day clock)
        run: |
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          # Days since last commit on this branch
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          AGE_DAYS=$(( (NOW - LAST) / 86400 ))
          echo "last commit age: ${AGE_DAYS} days"
          if [ "$AGE_DAYS" -ge 21 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ keepalive" > .keepalive
            git add .keepalive
            git commit -m "chore: keepalive heartbeat [skip ci]"
            git push
            echo "heartbeat committed"
          else
            echo "recent activity — no commit needed"
          fi
