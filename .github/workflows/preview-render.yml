name: Dry render — approved style (no upload)

# Why this exists:
#   The only renderer that produces the owner-approved widescreen style lives on
#   PR #112's branch (arena/564c86c7-youtube-automation). `main` still fails closed
#   on purpose. Dispatching `produce.yml` by hand requires picking that branch in
#   the Actions UI, and the "Use workflow from" dropdown kept falling back to
#   `main`, so every manual run died on the legacy-renderer guard.
#
#   This workflow removes the branch choice entirely: it is triggered by a push to
#   THIS branch and checks out the PR #112 ref itself. DRY_RUN is hard-coded and
#   `--dry-run` is always passed, so it can render but never publish.
#
#   Trigger it by changing the marker file .ci/preview-render. Ordinary pushes to
#   this branch do not start it.

on:
  push:
    branches: [arena/eb029c66-youtube-automation]
    paths:
      - '.ci/preview-render'
  workflow_dispatch:
    inputs:
      job:
        description: "Queue file to render (defaults to 0010)"
        required: false
        default: "0010-psalm-121-he-who-keeps-you-will-neither-slumber-no.md"

permissions:
  contents: read

concurrency:
  group: preview-render
  cancel-in-progress: false

env:
  # Branch that carries the preview overlays and the workflow itself.
  OVERLAY_REF: arena/eb029c66-youtube-automation
  JOB: ${{ github.event.inputs.job || '0010-psalm-121-he-who-keeps-you-will-neither-slumber-no.md' }}
  DRY_RUN: "1"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  ENABLE_KEYLESS_SOURCES: "0"

jobs:
  dry-render:
    name: Dry render in approved style
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the PR #112 renderer
        uses: actions/checkout@v4
        with:
          ref: arena/564c86c7-youtube-automation
          fetch-depth: 0

      - name: Show what will be rendered
        run: |
          echo "ref: $(git rev-parse --short HEAD) $(git log -1 --format=%s)"
          echo "job: $JOB"
          ls -l "content/queue/$JOB"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: ./.github/actions/setup-render-deps

      # Local CPU alignment, same pin as produce.yml on that branch. Split into
      # separate steps so the run page says exactly which part broke — the logs of
      # this repo are not readable from the review sandbox, only the summary is.
      - name: Install faster-whisper
        run: |
          set -o pipefail
          if ! python -m pip install 'faster-whisper==1.2.1' 'av<19' 'huggingface-hub<1' 2>&1 \
               | tee pip-whisper.log | tail -n 40; then
            {
              echo "### faster-whisper install FAILED"
              echo '```'
              tail -n 40 pip-whisper.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Download the alignment model
        run: |
          python - <<'PYMODEL' 2>&1 | tail -n 40
          from huggingface_hub import snapshot_download
          path = snapshot_download(repo_id='Systran/faster-whisper-small.en',
                                   local_dir='output/alignment-model')
          print('downloaded to', path)
          PYMODEL
          ls -l output/alignment-model | head -20
          test -f output/alignment-model/model.bin

      # Advisory: measures the offline alignment against the existing Psalm 91
      # reference. A tolerance miss is reported, not fatal here, so the dry render
      # below still runs and the owner sees the actual master.
      - name: Alignment tolerance diagnostic (advisory)
        continue-on-error: true
        run: |
          python scripts/check_prayer_alignment.py --model output/alignment-model 2>&1 | tee alignment.log || true
          {
            echo "### Alignment diagnostic (advisory)"
            echo '```'
            tail -n 20 alignment.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PREVIEW-ONLY OVERLAYS — not merged anywhere. Both exist because the PR's
      # guards reject tokenisations that speech recognisers legitimately produce:
      #
      #  1. faster-whisper returns some words with zero length (start == end), and
      #     prayer_visuals.sentence_stream rejects that with `end <= start`. The
      #     consumer only compares timestamps, so a zero-length word is harmless.
      #  2. prayer_alignment.py demands exactly one recognised token per script
      #     word and aborted job 0010 with "word count differs: 883 vs 884;
      #     mismatches=[(['for', 'evermore'], ['forevermore'])]". .ci ships a
      #     tolerant matcher (unit-tested in tests/test_prayer_alignment_preview.py)
      #     that maps script words onto what was heard and still refuses
      #     non-monotonic, non-finite, negative or low-confidence timings.
      #
      # Neither may be used for a real upload until it is merged into PR #112.
      - name: Apply preview alignment overlays (preview only)
        run: |
          set -euxo pipefail
          # The job checked out PR #112's tree, so the overlay file is not here:
          # fetch it from this branch, which is where it is reviewed and tested.
          curl -sSfL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${OVERLAY_REF}/.ci/prayer_alignment_preview.py" \
            -o pipeline/prayer_alignment.py
          head -1 pipeline/prayer_alignment.py
          python - <<'PYPATCH'
          from pathlib import Path
          path = Path('pipeline/prayer_visuals.py')
          text = path.read_text()
          if 'end <= start' not in text:
              raise SystemExit('prayer_visuals.py: expected guard not found')
          path.write_text(text.replace('end <= start', 'end < start'))
          print('patched pipeline/prayer_visuals.py')
          PYPATCH
          python -c "import sys; sys.path.insert(0, '.'); import pipeline.prayer_alignment as m; print('matcher loaded from', m.__file__)"
          git --no-pager diff --stat
          {
            echo '### Preview overlays applied (not merged)'
            echo '```diff'
            git --no-pager diff -U1 -- pipeline/prayer_visuals.py
            echo '```'
            echo 'pipeline/prayer_alignment.py replaced by .ci/prayer_alignment_preview.py'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Render (no upload)
        run: |
          set +e
          python -m pipeline.run --dry-run --job "content/queue/$JOB" 2>&1 | tee render.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Dry render (exit $rc) — nothing was uploaded"
            echo '```'
            tail -n 60 render.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            tail -n 20 render.log | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$rc"

      # When a gate rejects the render, the artifacts still hold whatever was
      # produced. Probe them and emit ANNOTATIONS (readable from the API) so the
      # failure is self-explaining instead of "shorter than five minutes".
      - name: Report what was actually produced
        if: always()
        run: |
          shopt -s nullglob
          shopt -s globstar
          found=0
          for f in output/**/*.mp3; do
            found=1
            bytes=$(stat -c%s "$f")
            line=$(ffmpeg -hide_banner -i "$f" 2>&1 | grep -E '^\s+Duration' | head -1 | tr -s ' ')
            echo "::warning title=Produced audio::$(basename "$f") $bytes bytes | ${line:-no duration}"
            {
              echo "- \`$f\` — $bytes bytes — ${line:-no duration}"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$found" = 1 ] || echo "::warning title=Produced audio::no mp3 was written"
          for f in output/**/*.json; do
            echo "::notice title=Job result::$(basename "$f") $(head -c 400 "$f")"
          done

      - name: Report the master
        if: always()
        run: |
          shopt -s nullglob
          for f in output/*/*.mp4; do
            echo "== $f ($(du -h "$f" | cut -f1))"
            ffmpeg -hide_banner -i "$f" 2>&1 | grep -E 'Duration|Stream #' || true
          done

      - name: Upload the master for review (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-render-${{ github.run_id }}
          path: |
            output/
            render.log
          retention-days: 7
