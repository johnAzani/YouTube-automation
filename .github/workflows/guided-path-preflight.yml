name: Guided Path read-only preflight

# Manual, read-only and independent of the channel registry. Saving secrets
# does not start this diagnostic or activate the channel.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check OAuth identity and upload scope (read-only)
        env:
          PRAYER10_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER10_YOUTUBE_CLIENT_ID }}
          PRAYER10_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER10_YOUTUBE_CLIENT_SECRET }}
          PRAYER10_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER10_YOUTUBE_REFRESH_TOKEN }}
          PRAYER10_YOUTUBE_CHANNEL_ID: ${{ secrets.PRAYER10_YOUTUBE_CHANNEL_ID }}
        run: python3 scripts/guided_path_preflight.py
