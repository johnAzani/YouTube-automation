name: Read-only eight-channel credential audit

# Push on this branch runs the audit without needing workflow-dispatch permission.
# It never renders, uploads, changes Studio settings, or prints secret values.
on:
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/channel-credential-audit.yml"]
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        channel: [secret-place, prayer2, prayer3, prayer4, prayer5, prayer6, prayer7, prayer8, prayer9, prayer10]
    steps:
      - name: Verify OAuth identity and Gemini model listing
        env:
          CHANNEL: ${{ matrix.channel }}
          CLIENT_ID: ${{ secrets[format('{0}YOUTUBE_CLIENT_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] }}
          CLIENT_SECRET: ${{ secrets[format('{0}YOUTUBE_CLIENT_SECRET', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] }}
          REFRESH_TOKEN: ${{ secrets[format('{0}YOUTUBE_REFRESH_TOKEN', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] }}
          # Public Channel 1 ID is pinned; other channels never inherit it.
          EXPECTED_CHANNEL: ${{ vars[format('{0}YOUTUBE_CHANNEL_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] || secrets[format('{0}YOUTUBE_CHANNEL_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] || (matrix.channel == 'secret-place' && 'UCtPI1r8vgtJ9n__7ksLBmCA' || '') }}
          GEMINI_KEY: ${{ secrets[format('{0}GEMINI_API_KEY', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          number = os.environ['CHANNEL']
          required = ('CLIENT_ID', 'CLIENT_SECRET', 'REFRESH_TOKEN', 'EXPECTED_CHANNEL', 'GEMINI_KEY')
          missing = [k for k in required if not os.environ.get(k, '').strip()]
          if missing:
              print(f'::error title=Channel {number} credential audit::Missing required fields: {", ".join(missing)}')
              raise SystemExit(1)
          def request_json(request):
              with urllib.request.urlopen(request, timeout=20) as response:
                  return json.load(response)

          try:
              data = urllib.parse.urlencode({
                  'client_id': os.environ['CLIENT_ID'], 'client_secret': os.environ['CLIENT_SECRET'],
                  'refresh_token': os.environ['REFRESH_TOKEN'], 'grant_type': 'refresh_token',
              }).encode()
              token = request_json(urllib.request.Request('https://oauth2.googleapis.com/token', data=data))
              req = urllib.request.Request(
                  'https://www.googleapis.com/youtube/v3/channels?part=id&mine=true',
                  headers={'Authorization': 'Bearer ' + token['access_token']},
              )
              channels = request_json(req).get('items', [])
              if len(channels) != 1 or channels[0].get('id') != os.environ['EXPECTED_CHANNEL'].strip():
                  print(f'::error title=Channel {number} credential audit::Authorized channel did not match the configured ID.')
                  raise SystemExit(1)
              print(f'::notice title=Channel {number} credential audit::OAuth refresh succeeded and channel ID matched.')
              if number == 'secret-place':
                  # Cross-check the pin against an independently recorded public upload.
                  req = urllib.request.Request(
                      'https://www.googleapis.com/youtube/v3/videos?part=snippet&id=rb6X37vQt7o',
                      headers={'Authorization': 'Bearer ' + token['access_token']},
                  )
                  videos = request_json(req).get('items', [])
                  if len(videos) != 1 or videos[0].get('snippet', {}).get('channelId') != channels[0].get('id'):
                      print('::error title=Channel secret-place credential audit::Recorded published video did not match the authorized channel.')
                      raise SystemExit(1)
                  print('::notice title=Channel secret-place credential audit::Recorded published video matches the authorized channel.')
              scopes = set(str(token.get('scope', '')).split())
              allowed = {'https://www.googleapis.com/auth/youtube', 'https://www.googleapis.com/auth/youtube.upload',
                         'https://www.googleapis.com/auth/youtubepartner'}
              if scopes and not scopes.intersection(allowed):
                  print(f'::error title=Channel {number} credential audit::Returned scope does not include an upload-capable YouTube scope.')
                  raise SystemExit(1)
              if not scopes:
                  print(f'::warning title=Channel {number} credential audit::Token response did not disclose scopes; upload capability remains unverified.')
              else:
                  print(f'::notice title=Channel {number} credential audit::Token response includes an upload-capable scope; upload itself was not tested.')
          except SystemExit:
              raise
          except urllib.error.HTTPError as exc:
              print(f'::error title=Channel {number} credential audit::OAuth refresh or channel lookup failed (HTTP {exc.code}); no response details logged.')
              raise SystemExit(1)
          except Exception:
              print(f'::error title=Channel {number} credential audit::OAuth refresh or channel lookup failed; no response details logged.')
              raise SystemExit(1)

          try:
              req = urllib.request.Request('https://generativelanguage.googleapis.com/v1beta/models?pageSize=1',
                                           headers={'x-goog-api-key': os.environ['GEMINI_KEY']})
              request_json(req)
              print(f'::notice title=Channel {number} credential audit::Gemini model listing succeeded; generation, TTS, billing and quota were not tested.')
          except urllib.error.HTTPError as exc:
              print(f'::error title=Channel {number} credential audit::Gemini model listing failed (HTTP {exc.code}); no response details logged.')
              raise SystemExit(1)
          except Exception:
              print(f'::error title=Channel {number} credential audit::Gemini model listing failed; no response details logged.')
              raise SystemExit(1)
          PY
