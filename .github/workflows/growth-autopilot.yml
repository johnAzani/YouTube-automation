name: Growth autopilot

# The closed-loop growth engine. Every day it:
#   1. snapshots public channel metrics (views/likes/comments + live subscriber count),
#   2. computes the performance-feedback artifact the brain reads to favour the themes
#      that are actually winning (the missing keystone — the brain used to author blind),
#   3. syncs the official series playlists so finished videos autoplay the next one
#      (session watch-time, the lever that moves the 4,000-hour YPP goal),
#   4. celebrates the live subscriber milestone (renders the Community card + copy).
#
# $0.00 lock: only the free YouTube Data API is used (the same upload token already
# configured). No paid tier, no new secret. Every engine is fail-soft — one failing
# never blocks the others. Feedback is committed only after successful collection
# and computation; an earlier report is otherwise left untouched.
#
# Privacy: the raw per-video snapshot stays a short-lived Actions artifact. Only the
# derived, aggregate performance_feedback.json is committed to source.
on:
  schedule:
    # 02:14 UTC = 03:14 Nigeria time — runs before the 03:14 UTC brain so the freshest
    # feedback is committed before the next authoring pass reads it.
    - cron: "14 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel id (secret-place, prayer2, prayer3, prayer4, prayer5, prayer6, prayer7, prayer8, prayer9, prayer10; blank = all provisioned channels)"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: growth-autopilot
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.discover.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
      - name: Discover provisioned channels for growth sync
        id: discover
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRAYER2_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER2_YOUTUBE_REFRESH_TOKEN }}
          PRAYER3_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER3_YOUTUBE_REFRESH_TOKEN }}
          PRAYER4_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER4_YOUTUBE_REFRESH_TOKEN }}
          PRAYER5_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER5_YOUTUBE_REFRESH_TOKEN }}
          PRAYER6_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER6_YOUTUBE_REFRESH_TOKEN }}
          PRAYER7_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER7_YOUTUBE_REFRESH_TOKEN }}
          PRAYER8_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER8_YOUTUBE_REFRESH_TOKEN }}
          PRAYER9_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER9_YOUTUBE_REFRESH_TOKEN }}
          PRAYER10_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER10_YOUTUBE_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from pipeline.channels import CHANNELS, normalize_channel_id, scheduled_channels
          requested = (os.environ.get("INPUT_CHANNEL") or "").strip()
          if requested:
              cid = normalize_channel_id(requested)
              if cid not in scheduled_channels():
                  raise SystemExit("Refusing unknown or inactive channel: " + cid)
              channels = [cid]
          else:
              channels = []
              for cid in scheduled_channels():
                  p = CHANNELS[cid].secret_prefix.rstrip("_")
                  token_key = f"{p}_YOUTUBE_REFRESH_TOKEN" if p else "YOUTUBE_REFRESH_TOKEN"
                  if (os.environ.get(token_key) or "").strip():
                      channels.append(cid)
              if not channels and "secret-place" in scheduled_channels():
                  channels = ["secret-place"]
          print(f"Discovered growth channels: {channels}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"channels={json.dumps(channels)}\n")
          PY

  growth:
    needs: plan
    if: ${{ needs.plan.outputs.channels != '[]' && needs.plan.outputs.channels != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJson(needs.plan.outputs.channels) }}
    env:
      CHANNEL_ID: ${{ matrix.channel }}
      YOUTUBE_CLIENT_ID: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), matrix.channel) && secrets[format('{0}YOUTUBE_CLIENT_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] || '' }}
      YOUTUBE_CLIENT_SECRET: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), matrix.channel) && secrets[format('{0}YOUTUBE_CLIENT_SECRET', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] || '' }}
      YOUTUBE_REFRESH_TOKEN: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), matrix.channel) && secrets[format('{0}YOUTUBE_REFRESH_TOKEN', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] || '' }}
      PRAYER2_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER2_YOUTUBE_CLIENT_ID }}
      PRAYER2_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER2_YOUTUBE_CLIENT_SECRET }}
      PRAYER2_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER2_YOUTUBE_REFRESH_TOKEN }}
      PRAYER3_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER3_YOUTUBE_CLIENT_ID }}
      PRAYER3_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER3_YOUTUBE_CLIENT_SECRET }}
      PRAYER3_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER3_YOUTUBE_REFRESH_TOKEN }}
      PRAYER4_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER4_YOUTUBE_CLIENT_ID }}
      PRAYER4_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER4_YOUTUBE_CLIENT_SECRET }}
      PRAYER4_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER4_YOUTUBE_REFRESH_TOKEN }}
      PRAYER5_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER5_YOUTUBE_CLIENT_ID }}
      PRAYER5_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER5_YOUTUBE_CLIENT_SECRET }}
      PRAYER5_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER5_YOUTUBE_REFRESH_TOKEN }}
      PRAYER6_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER6_YOUTUBE_CLIENT_ID }}
      PRAYER6_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER6_YOUTUBE_CLIENT_SECRET }}
      PRAYER6_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER6_YOUTUBE_REFRESH_TOKEN }}
      PRAYER7_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER7_YOUTUBE_CLIENT_ID }}
      PRAYER7_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER7_YOUTUBE_CLIENT_SECRET }}
      PRAYER7_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER7_YOUTUBE_REFRESH_TOKEN }}
      PRAYER8_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER8_YOUTUBE_CLIENT_ID }}
      PRAYER9_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER9_YOUTUBE_CLIENT_ID }}
      PRAYER10_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER10_YOUTUBE_CLIENT_ID }}
      PRAYER8_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER8_YOUTUBE_CLIENT_SECRET }}
      PRAYER9_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER9_YOUTUBE_CLIENT_SECRET }}
      PRAYER10_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER10_YOUTUBE_CLIENT_SECRET }}
      PRAYER8_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER8_YOUTUBE_REFRESH_TOKEN }}
      PRAYER9_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER9_YOUTUBE_REFRESH_TOKEN }}
      PRAYER10_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER10_YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), matrix.channel) && (vars[format('{0}YOUTUBE_CHANNEL_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] || secrets[format('{0}YOUTUBE_CHANNEL_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])]) || '' }}
      GEMINI_API_KEY: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), matrix.channel) && secrets[format('{0}GEMINI_API_KEY', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] || '' }}
      GH_TOKEN: ${{ github.token }}
      # The autopilot is a measurement/sync job, not the weekly human report: do not
      # file a GitHub issue on every daily run.
      METRICS_POST_ISSUE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh main tip across matrix legs
        run: git pull --ff-only origin main || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Snapshot public channel metrics (${{ matrix.channel }})
        id: metrics
        continue-on-error: true
        run: python -u scripts/metrics_snapshot.py --channel "${{ matrix.channel }}"

      - name: Compute closed-loop performance feedback (${{ matrix.channel }})
        # A failed snapshot must not replace the last valid signal with a report
        # based on missing or stale input. A successful empty snapshot is valid and
        # produces a neutral report for a channel without enough data.
        id: feedback
        if: ${{ steps.metrics.outcome == 'success' }}
        continue-on-error: true
        run: python -u scripts/performance_feedback.py --channel "${{ matrix.channel }}"

      - name: Report unavailable feedback input (${{ matrix.channel }})
        if: ${{ steps.metrics.outcome != 'success' }}
        run: echo "::warning title=Feedback not refreshed::The public metrics snapshot failed; the previous feedback artifact was preserved."

      - name: Sync official series playlists (${{ matrix.channel }})
        continue-on-error: true
        run: python -u scripts/manage_playlists.py --channel "${{ matrix.channel }}"

      - name: Set up the channel page (${{ matrix.channel }})
        # pipeline/channel_page.py: search keywords, a trailer for visitors and
        # home-page shelves, each only where the page has none of its own.
        continue-on-error: true
        run: python -u scripts/setup_channel_page.py --channel "${{ matrix.channel }}"

      - name: Celebrate live subscriber milestone (${{ matrix.channel }})
        continue-on-error: true
        run: python -u scripts/celebrate_milestone.py --channel "${{ matrix.channel }}"

      - name: Upload metrics + milestone card as short-lived artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-autopilot-${{ matrix.channel }}-${{ github.run_id }}
          path: |
            content/metrics.csv
            content/channel-metrics*.json
            content/community/milestone_*.png
          retention-days: 30
          if-no-files-found: ignore

      - name: Commit the derived feedback artifact (${{ matrix.channel }})
        # Skipping computation is not enough: copying the checkout's old file after
        # reset could otherwise overwrite newer feedback committed by another run.
        if: ${{ steps.metrics.outcome == 'success' && steps.feedback.outcome == 'success' }}
        # Preserve only this leg's derived feedback file across fetch + reset --mixed
        # so multi-leg runs never stage unrelated upstream commits as deletions.
        run: |
          FEEDBACK_REL="$(python3 -c 'import sys; sys.path.insert(0, "."); from pathlib import Path; from pipeline.performance_feedback import feedback_path_for, REPO_ROOT; print(feedback_path_for(sys.argv[1]).relative_to(REPO_ROOT))' "${{ matrix.channel }}")"
          if [ ! -f "$FEEDBACK_REL" ]; then
            echo "no feedback file written at $FEEDBACK_REL"
            exit 0
          fi
          cp "$FEEDBACK_REL" /tmp/channel_feedback.json
          git config user.name "growth-autopilot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --mixed origin/main
            mkdir -p "$(dirname "$FEEDBACK_REL")"
            cp /tmp/channel_feedback.json "$FEEDBACK_REL"
            git add "$FEEDBACK_REL"
            if git diff --cached --quiet; then
              echo "feedback unchanged for ${{ matrix.channel }}"
              exit 0
            fi
            git commit --quiet -m "chore(growth): refresh ${{ matrix.channel }} performance feedback [skip ci]"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::warning::could not push the feedback artifact; the run log is the record"

      - name: Choose new titles for long-forms nobody has watched (${{ matrix.channel }})
        # pipeline/retitle.py: long-forms at least 7 days old with 2 views or
        # fewer, once per video, two per channel per day. Needs this run's
        # snapshot for the view counts; writes only a ledger.
        id: retitle
        if: ${{ steps.metrics.outcome == 'success' }}
        continue-on-error: true
        run: python -u scripts/retitle_unwatched.py --channel "${{ matrix.channel }}" --ledger /tmp/retitles.json

      - name: Commit the new titles (${{ matrix.channel }})
        # The receipt is stamped on a fresh copy from main, never on this
        # checkout's older one. The monitor's metadata sync pushes the receipt's
        # title to YouTube (scripts/retrofit_published_metadata.py --sync-pending).
        if: ${{ steps.retitle.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ ! -s /tmp/retitles.json ] || [ "$(tr -d ' \n' < /tmp/retitles.json)" = "[]" ]; then
            echo "no new titles for ${{ matrix.channel }}"
            exit 0
          fi
          FILES="$(python -c 'import json,sys; print("\n".join(e["file"] for e in json.load(open(sys.argv[1]))))' /tmp/retitles.json)"
          git config user.name "growth-autopilot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --mixed origin/main
            for f in $FILES; do git checkout origin/main -- "$f" 2>/dev/null || true; done
            CHANGED="$(python scripts/retitle_unwatched.py --apply-ledger /tmp/retitles.json)"
            if [ -z "$CHANGED" ]; then
              echo "no receipt needed a new title after refreshing from main"
              exit 0
            fi
            for f in $CHANGED; do git add "$f"; done
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit --quiet -m "chore(growth): retitle unwatched ${{ matrix.channel }} long-forms [skip ci]"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::warning::could not push the new titles; they will be chosen again tomorrow"

      - name: Surface a failing engine without masking the others
        if: always()
        run: |
          if [ "${{ steps.metrics.outcome }}" != "success" ]; then
            echo "::warning title=Metrics snapshot degraded (${{ matrix.channel }})::feedback was not refreshed; check the metrics step"
          elif [ "${{ steps.feedback.outcome }}" != "success" ]; then
            echo "::warning title=Feedback computation failed (${{ matrix.channel }})::feedback was not refreshed; check the feedback step"
          fi
          echo "Growth autopilot (${{ matrix.channel }}) finished. Check step outcomes for each engine."
