name: Dry-run pipeline (CI proof)

# Proves the studio still works on every push — with ZERO secrets and ZERO cost.
#
# History (read before "simplifying" this file):
#   The previous version ran only `pipeline.run --dry-run` on `content/queue/*.md | head -n1`
#   with `ENABLE_KEYLESS_SOURCES=0`. That combination cannot pass:
#     1. head -n1 selected an out-of-niche `niche: history` draft, so
#        `pipeline.run::_validate_finance_niche` raised before a frame was rendered; and
#     2. with keyless sources off AND no Pexels/Pixabay secrets, `fetch_scene_assets` has no
#        provider left, and `pipeline/run.py` hard-fails rather than substituting a title card.
#   The repo sat red. See MAINTENANCE.md §2.
#
# So CI is now split by what each job can actually prove:
#   checks         — hermetic, required. Unit tests + setup doctor.
#   offline-render — hermetic, required. Real end-to-end render from committed assets.
#   pipeline-dry-run — needs the network, advisory only (third-party free APIs can 404).

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dry-run-${{ github.ref }}
  cancel-in-progress: true

env:
  DRY_RUN: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Hermetic checks — must be green. No network, no secrets, ~30s.
  # ---------------------------------------------------------------------------
  checks:
    name: Unit tests + doctor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Python deps
        run: pip install -r requirements.txt

      # tests/ was never wired into CI before — this is the job that runs it.
      # test_queue_integrity is the guard that catches an out-of-niche job in content/queue/.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # Hermetic: compares image-search/LICENSES.yml against the files on disk. Fails if a
      # still was added without a ledger entry, or if a file's bytes changed under a
      # recorded clearance. See docs/ASSET_SOURCING.md and MAINTENANCE.md §4.
      - name: Authored-still licence ledger
        run: python scripts/licence_ledger.py check

      # The 4 secret checks are expected to fail here; the job passes on the structural ones.
      # `set +e` so a missing API key does not fail CI, then report the score.
      - name: Setup doctor (structural checks)
        run: |
          set +e
          python scripts/doctor.py | tee doctor.txt
          set -e
          if grep -q '❌ workflow:' doctor.txt; then
            echo "::error::a required workflow file is missing"
            exit 1
          fi
          echo "doctor: structural checks OK (secrets intentionally absent in CI)"

  # ---------------------------------------------------------------------------
  # 2. Hermetic render — must be green. The real end-to-end proof.
  #    tools/deep_dive.py + tools/shorts.py bundle narration (assets/deepdive/*.mp3),
  #    fonts (assets/fonts/) and story stills (image-search/), so with
  #    ENABLE_STOCK_BROLL=0 they need no network and no keys.
  # ---------------------------------------------------------------------------
  offline-render:
    name: Offline end-to-end render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENABLE_STOCK_BROLL: "0"     # use committed story stills, never hit a stock API
      ENABLE_KEYLESS_SOURCES: "0" # belt and braces: nothing in this job may use the network
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Render long-form deep dive (Enron, ~115s @ 720p)
        run: python tools/deep_dive.py enron

      - name: Render vertical Short (Enron, 9:16)
        run: python tools/shorts.py short-enron

      # Assert the renders are real media, not zero-byte stubs.
      - name: Verify output is valid video with an audio track
        run: |
          for f in social/deep-dive-enron.mp4 social/short-enron.mp4; do
            test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
            ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$f" \
              | grep -q video || { echo "::error::$f has no video stream"; exit 1; }
            ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "$f" \
              | grep -q audio || { echo "::error::$f has no audio stream"; exit 1; }
            echo "ok $f $(du -h "$f" | cut -f1)"
          done

      # The source ledger is the monetization audit trail (docs/ASSET_SOURCING.md).
      - name: Verify per-scene source ledger
        run: |
          for f in output/deep-stock/enron/scene-sources.json output/short-stock/short-enron/scene-sources.json; do
            test -s "$f" || { echo "::error::$f missing"; exit 1; }
            python - "$f" <<'PY'
          import json, sys
          rows = json.load(open(sys.argv[1]))
          assert rows, f"{sys.argv[1]} logged no scenes"
          missing = [r for r in rows if not r.get("file") and not r.get("media")]
          assert not missing, f"{sys.argv[1]} has scenes with no recorded source: {missing}"
          print(f"ok {sys.argv[1]} — {len(rows)} scenes logged")
          PY
          done

      - name: Upload render
        uses: actions/upload-artifact@v4
        with:
          name: offline-render-${{ github.run_id }}
          path: |
            social/*.mp4
            output/deep-stock/enron/scene-sources.json
            output/short-stock/short-enron/scene-sources.json
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3. The general queue -> render path. Advisory.
  #    This is the only job that touches the internet: it must reach a free stock
  #    provider, because `pipeline/run.py` refuses to substitute a generated title
  #    card for a scene with no licensed match (by design — see tests/).
  #    Keyless providers (Openverse / Wikimedia / Internet Archive / NASA) need no
  #    key, so this stays zero-secret; it is NOT zero-network. `continue-on-error`
  #    keeps a third-party outage from turning CI red, while the annotation stays
  #    visible. Add PEXELS_API_KEY / PIXABAY_API_KEY secrets to make it reliable.
  # ---------------------------------------------------------------------------
  pipeline-dry-run:
    name: General pipeline dry-run (needs network)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      ENABLE_KEYLESS_SOURCES: "1" # the key-free providers — required when there are no API keys
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (ffmpeg)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Python deps
        run: pip install -r requirements.txt

      # Pick an IN-NICHE job explicitly rather than `head -n1`. The unit-test guard
      # already guarantees every queued job is in-niche; this makes the selection
      # independent of filename ordering anyway.
      - name: Select an in-niche queue job
        id: pick
        run: |
          JOB=$(python - <<'PY'
          from pathlib import Path
          from pipeline.script_doc import parse_script
          from pipeline.run import _validate_finance_niche
          for p in sorted(Path("content/queue").glob("*.md")):
              if p.stem.lower() == "readme":
                  continue
              doc = parse_script(p)
              try:
                  _validate_finance_niche(doc)
              except RuntimeError:
                  continue
              print(p)
              break
          PY
          )
          if [ -z "$JOB" ]; then
            echo "::warning::no in-niche job in content/queue/ — nothing to render"
            echo "job=" >> "$GITHUB_OUTPUT"
          else
            echo "job=$JOB" >> "$GITHUB_OUTPUT"
            echo "selected: $JOB"
          fi

      # Self-diagnosing on purpose: this job is advisory, so a silent failure would just
      # rot. Emit the tail of the log as an annotation + step summary, because the raw
      # runner log is only reachable from a browser session.
      - name: Render it (no upload)
        if: steps.pick.outputs.job != ''
        run: |
          JOB="${{ steps.pick.outputs.job }}"
          set +e
          python -m pipeline.run --dry-run --job "$JOB" 2>&1 | tee render.log
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            {
              echo "### pipeline-dry-run failed (exit $rc)"
              echo
              echo "Job: \`$JOB\`. This job is advisory, so CI stays green — but the"
              echo "general queue path did not complete. The usual cause is that no free"
              echo "stock provider returned a licensed match for some scene query, which"
              echo "the pipeline refuses to paper over with a title card."
              echo
              echo '```'
              tail -n 20 render.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::pipeline dry-run failed (exit $rc) for $JOB — last line: $(tail -n 1 render.log)"
            exit "$rc"
          fi

      - name: Upload render + log
        if: always() && steps.pick.outputs.job != ''
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-dry-run-${{ github.run_id }}
          path: |
            output/
            render.log
          retention-days: 1
          if-no-files-found: warn
