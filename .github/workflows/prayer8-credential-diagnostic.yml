name: Channel 8 read-only credential diagnostic

# Runs only when this diagnostic is changed or manually dispatched. No video is
# rendered or uploaded. OAuth refresh and channels.list verify account binding;
# Gemini model listing checks the API key without generating content. Never log
# response bodies, tokens, IDs, or exception details.
on:
  push:
    branches: ["arena/**", main]
    paths: [.github/workflows/prayer8-credential-diagnostic.yml]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Channel 8 credentials without disclosing them
        env:
          CLIENT_ID: ${{ secrets.PRAYER8_YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PRAYER8_YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.PRAYER8_YOUTUBE_REFRESH_TOKEN }}
          EXPECTED_CHANNEL: ${{ secrets.PRAYER8_YOUTUBE_CHANNEL_ID }}
          GEMINI_KEY: ${{ secrets.PRAYER8_GEMINI_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          required = ('CLIENT_ID', 'CLIENT_SECRET', 'REFRESH_TOKEN', 'EXPECTED_CHANNEL', 'GEMINI_KEY')
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              print('::error::One or more Channel 8 secrets are unavailable to this workflow.')
              raise SystemExit(1)

          try:
              payload = urllib.parse.urlencode({
                  'client_id': os.environ['CLIENT_ID'],
                  'client_secret': os.environ['CLIENT_SECRET'],
                  'refresh_token': os.environ['REFRESH_TOKEN'],
                  'grant_type': 'refresh_token',
              }).encode()
              request = urllib.request.Request('https://oauth2.googleapis.com/token', data=payload)
              with urllib.request.urlopen(request, timeout=20) as response:
                  access_token = json.load(response)['access_token']
              request = urllib.request.Request(
                  'https://www.googleapis.com/youtube/v3/channels?part=id&mine=true',
                  headers={'Authorization': 'Bearer ' + access_token},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  channels = json.load(response).get('items', [])
              if len(channels) != 1 or channels[0].get('id') != os.environ['EXPECTED_CHANNEL'].strip():
                  print('::error::The authorized YouTube channel does not match the configured Channel 8 ID.')
                  raise SystemExit(1)
              print('::notice::YouTube OAuth refresh succeeded and the authorized channel matches the configured ID.')
          except SystemExit:
              raise
          except urllib.error.HTTPError as exc:
              print(f'::error::YouTube OAuth or channel lookup failed with HTTP {exc.code}; no response details logged.')
              raise SystemExit(1)
          except Exception:
              print('::error::YouTube OAuth or channel lookup failed; no response details logged.')
              raise SystemExit(1)

          try:
              request = urllib.request.Request(
                  'https://generativelanguage.googleapis.com/v1beta/models?pageSize=1',
                  headers={'x-goog-api-key': os.environ['GEMINI_KEY']},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  json.load(response)
              print('::notice::Gemini API key can list models; generation, TTS, billing and quota are not verified.')
          except urllib.error.HTTPError as exc:
              print(f'::error::Gemini model listing failed with HTTP {exc.code}; no response details logged.')
              raise SystemExit(1)
          except Exception:
              print('::error::Gemini model listing failed; no response details logged.')
              raise SystemExit(1)
          PY
