name: Set video thumbnail (validated studio)

# Renders the validated thumbnail pack for a published job and, when dry_run is
# unticked, sets the chosen variant on the live video via thumbnails.set (50 units).
#
# Why a workflow: the owner asked for the thumbnail to be reworked on the published
# Psalm 121 video (6M6oV8MxD9s). Rendering and setting it must run where the YouTube
# secrets are, which is here, not in a review sandbox.
#
# Defaults are safe: dry_run is true, so the first run only produces images.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Target channel (own GCP project & secrets)"
        type: choice
        options: [secret-place, prayer2, prayer3, prayer4, prayer5, prayer6, prayer7, prayer8, prayer9, prayer10]
        default: secret-place
      job:
        description: "Published job file (content/published/…md)"
        required: true
        default: "0010-psalm-121-he-who-keeps-you-will-neither-slumber-no.md"
      video_id:
        description: "YouTube video ID to update"
        required: true
        default: "6M6oV8MxD9s"
      variant:
        description: "hook | quiet | poster = CTR pack; main | b | c = studio pack. All are always rendered."
        type: choice
        options: [hook, quiet, poster, main, b, c]
        default: hook
      hero:
        description: "Override the hero text on the text variants (blank = each concept keeps its own copy)"
        required: false
        default: ""
      dry_run:
        description: "Render only, do not change the live thumbnail"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: set-thumbnail
  cancel-in-progress: false

env:
  CHANNEL_ID: ${{ inputs.channel || 'secret-place' }}
  YOUTUBE_CLIENT_ID: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), inputs.channel) && secrets[format('{0}YOUTUBE_CLIENT_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[inputs.channel])] || '' }}
  YOUTUBE_CLIENT_SECRET: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), inputs.channel) && secrets[format('{0}YOUTUBE_CLIENT_SECRET', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[inputs.channel])] || '' }}
  YOUTUBE_REFRESH_TOKEN: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), inputs.channel) && secrets[format('{0}YOUTUBE_REFRESH_TOKEN', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[inputs.channel])] || '' }}
  YOUTUBE_EXPECTED_CHANNEL_ID: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), inputs.channel) && (vars[format('{0}YOUTUBE_CHANNEL_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[inputs.channel])] || secrets[format('{0}YOUTUBE_CHANNEL_ID', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[inputs.channel])]) || '' }}

jobs:
  thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: python -m pip install -r requirements.txt

      - name: Render the validated packs
        run: |
          python - <<'PYRENDER'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from pipeline.script_doc import parse_script
          from pipeline.thumbnail_ctr import curated_backdrop_for, generate_ctr_pack
          from pipeline.thumbnail_studio import choose_hero, generate_style_pack, mobile_preview

          job = Path('content/published') / os.environ['JOB']
          doc = parse_script(job)
          hero = os.environ.get('HERO') or ''
          out = Path('output/thumbnails')
          doc_key = str(doc.id or doc.slug)
          resolved_hero = hero or str(doc.meta.get('thumb_text') or '').strip() or choose_hero(doc)

          # CTR pack first: three concepts that never restate the title, sized and
          # graded to survive a dark-mode phone feed in the channel's own daypart.
          ctr = generate_ctr_pack(
              out,
              hero_override=resolved_hero or None,
              doc_key=doc_key,
              backdrop=curated_backdrop_for(doc_key, channel_id=doc.channel),
              channel_id=doc.channel,
          )
          # The studio pack is kept as a control and for the older variants.
          studio = generate_style_pack(resolved_hero, out)
          for r in ctr + studio:
              mobile_preview(r.path, r.path.with_name(r.path.stem + '_mobile.png'))

          (out / 'report.json').write_text(json.dumps({
              'job': doc.id, 'hero_override': hero or None,
              'ctr': [r.as_dict() for r in ctr],
              'studio': [r.as_dict() for r in studio],
          }, indent=2, ensure_ascii=False), encoding='utf-8')

          for r in ctr:
              print(f"::notice title=CTR {r.variant} ({r.concept})::{r.path.name} | hero {r.hero_px}px "
                    f"{r.lines} lines | contrast {r.contrast:.1f}:1 | mean luma {r.mean_luma:.0f} | "
                    f"edge {r.edge_luma:.0f} vs UI 15 | bright {r.bright_share:.0%} | {r.file_kb} KiB")
          for r in studio:
              print(f"::notice title=Studio {r.variant}::{r.path.name} | hero {r.hero_px}px | "
                    f"contrast {r.contrast:.1f}:1 | {r.file_kb} KiB")
          PYRENDER
        env:
          JOB: ${{ inputs.job }}
          HERO: ${{ inputs.hero }}

      - name: Upload pack (review artifact)
        uses: actions/upload-artifact@v4
        with:
          name: thumbnails-${{ github.run_id }}
          path: output/thumbnails/
          retention-days: 14

      - name: Set the live thumbnail
        if: ${{ !inputs.dry_run }}
        run: |
          python - <<'PYSET'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, '.')
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from pipeline.channels import normalize_channel_id, scheduled_channels
          from pipeline.thumbnail_target_guard import verified_video_snippet
          from pipeline.upload import _credentials

          if normalize_channel_id(os.environ.get('CHANNEL_ID')) not in scheduled_channels():
              raise SystemExit('Refusing live thumbnail update for an unknown or inactive channel.')
          if not os.environ.get('YOUTUBE_EXPECTED_CHANNEL_ID', '').strip():
              raise SystemExit('Expected YouTube channel ID is required for a live thumbnail update.')
          variant = os.environ['VARIANT']
          names = {'main': 'thumbnail.jpg'}
          name = names.get(variant, f'thumbnail_{variant}.jpg')
          path = Path('output/thumbnails') / name
          if not path.is_file():
              raise SystemExit(f'missing {path}')
          youtube = build('youtube', 'v3', credentials=_credentials(), cache_discovery=False)
          # The token and the selected video must both match the expected owner.
          # Merely logging the old URL is not a backup of its image bytes.
          item = verified_video_snippet(youtube, os.environ['VIDEO_ID'], os.environ['YOUTUBE_EXPECTED_CHANNEL_ID'])
          print('before:', (item.get('thumbnails') or {}).get('maxres', {}).get('url'))
          youtube.thumbnails().set(
              videoId=os.environ['VIDEO_ID'],
              media_body=MediaFileUpload(str(path), mimetype='image/jpeg'),
          ).execute()
          after = youtube.videos().list(part='snippet', id=os.environ['VIDEO_ID']).execute()
          url = (((after.get('items') or [{}])[0].get('snippet') or {}).get('thumbnails') or {}).get('maxres', {}).get('url')
          print('after:', url)
          print(f'::notice title=Thumbnail set::{os.environ["VIDEO_ID"]} -> {url}')
          PYSET
        env:
          VIDEO_ID: ${{ inputs.video_id }}
          VARIANT: ${{ inputs.variant }}
