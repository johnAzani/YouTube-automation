name: Praise Garden Gemini read-only preflight

# Temporary branch-only trigger for the first test, before the workflow exists
# on the default branch. Remove after the test; no publishing is enabled.
on:
  push:
    branches: ["arena/32ec72b4-youtube-automation"]
    paths: [".github/workflows/praise-garden-gemini-preflight.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List Gemini model metadata (read-only)
        env:
          PRAYER9_GEMINI_API_KEY: ${{ secrets.PRAYER9_GEMINI_API_KEY }}
        run: python3 scripts/praise_garden_gemini_preflight.py
