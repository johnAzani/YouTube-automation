name: Praise Garden Gemini read-only preflight

# Manual and read-only. Saving a key does not start the diagnostic or activate
# the channel. The model-list request performs no generation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: List Gemini model metadata (read-only)
        env:
          PRAYER9_GEMINI_API_KEY: ${{ secrets.PRAYER9_GEMINI_API_KEY }}
        run: python3 scripts/praise_garden_gemini_preflight.py
