name: Weekly metrics snapshot

# A weekly cron alone means a broken snapshot is invisible for six days, and on
# 30 October the run failed with literally "Process completed with exit code 1" and
# an unreachable log: three days of no measurement and no diagnosis. It now also
# runs after each production run — the moment new numbers exist — and a run after a
# publish is annotated for the run page, never filed as an issue (that stays with the
# weekly snapshot, so the tracker does not fill with one issue per video).
on:
  schedule:
    - cron: "41 18 * * 5"   # Fridays 7:41pm Nigeria time (18:41 UTC) — end of the week, US afternoon
  workflow_run:
    workflows: ["Produce video"]
    types: [completed]
  workflow_dispatch:
    inputs:
      channel:
        description: "Target channel (own GCP project & secrets)"
        type: choice
        options: [secret-place, prayer2]
        default: secret-place

permissions:
  contents: write
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHANNEL_ID: ${{ inputs.channel || 'secret-place' }}
      YOUTUBE_CLIENT_ID: ${{ inputs.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ inputs.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ inputs.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ inputs.channel == 'prayer2' && (vars.PRAYER2_YOUTUBE_CHANNEL_ID || secrets.PRAYER2_YOUTUBE_CHANNEL_ID) || (vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Snapshot channel metrics
        env:
          METRICS_POST_ISSUE: ${{ github.event_name == 'workflow_run' && '0' || '1' }}
        run: python -u scripts/metrics_snapshot.py

      # This repository is public. Keep the public-video snapshot out of git history
      # and retain it only as a short-lived artifact; never commit API metrics to source.
      - name: Upload 30-day metrics snapshot
        uses: actions/upload-artifact@v4
        if: success() && hashFiles('content/metrics.csv') != ''
        with:
          name: public-video-metrics-${{ inputs.channel || 'secret-place' }}-${{ github.run_id }}
          path: |
            content/metrics.csv
            content/channel-metrics.json
          retention-days: 30
          if-no-files-found: ignore
