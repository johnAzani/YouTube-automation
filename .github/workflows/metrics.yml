name: Weekly metrics snapshot

on:
  schedule:
    - cron: "41 18 * * 5"   # Fridays 18:41 UTC — end of the week, US afternoon
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Snapshot channel metrics
        run: python scripts/metrics_snapshot.py

      # This repository is public. Keep the public-video snapshot out of git history
      # and retain it only as a short-lived artifact; never commit API metrics to source.
      - name: Upload 30-day metrics snapshot
        uses: actions/upload-artifact@v4
        if: success() && hashFiles('content/metrics.csv') != ''
        with:
          name: public-video-metrics-${{ github.run_id }}
          path: |
            content/metrics.csv
            content/channel-metrics.json
          retention-days: 30
          if-no-files-found: ignore
