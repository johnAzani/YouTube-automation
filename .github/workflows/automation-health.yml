# Daily check that the scheduled workflows actually run.
#
# Why: the Community Tab workflow had zero runs in its entire life. It showed as
# "active", its YAML was valid, and nothing reported a problem — because a
# workflow that never starts never fails. Its publish step also never called an
# API, so even a successful run would have posted nothing while reporting success.
# Both were invisible from the Actions dashboard. This job makes silence visible.

# Same lesson as monitor.yml: a job that only exists on a schedule is at the mercy
# of a scheduler that ran this morning's slots hours late and skipped others. The
# nightly audit also runs after each production run, which is when a regression
# would appear.
# 2 November: this file had a schedule and a workflow_run trigger and *still*
# recorded zero runs in its whole life. The schedule had not come round yet and the
# workflow_run only fires when a production run finishes — so between merges it was
# simply absent, which is the exact blind spot it exists to catch. It now also runs
# on every push to main, and that run only audits; filing an issue is left to the
# scheduled and post-production runs so a merge cannot raise a false alarm while the
# queue is mid-commit.
on:
  schedule:
    - cron: "14 20 * * *"   # after the 8:14pm release slot, before the 3:14am expansion
  push:
    branches: [main]
  workflow_run:
    workflows: ["Produce video"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write          # the watchdog opens/closes one tracking issue

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python deps
        # This job had no dependency install. `python -m scripts.pipeline_watchdog`
        # imports PyYAML to read the workflow files, so every run died on
        # ModuleNotFoundError — and because the step above ended with `|| true`,
        # the crash looked like a clean pass. The workflow was red for days with
        # the annotation "Process completed with exit code 1" and nothing else.
        run: pip install -r requirements.txt

      - name: Are the crons firing?
        id: crons
        # No blanket `|| true`: that is what hid a ModuleNotFoundError behind a
        # green tick. The script itself returns 0 when it merely *reports* a queue
        # as empty; a non-zero exit here is a crash, and a crash must be loud.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python -m scripts.automation_health 2>&1 | tee health.log
          rc=${PIPESTATUS[0]}
          { echo "### 🩺 Cron audit (exit $rc)"; echo '```'; tail -n 30 health.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ] && ! grep -q "^queue: " health.log; then
            echo "::error title=The health check itself crashed::exit $rc and no audit table was produced — this is a broken check, not a finding"
            exit 1
          fi
          exit 0

      - name: File or close the stall issue
        if: github.event_name != 'push'
        # The owner is not watching the Actions tab. An issue is an email, so the
        # pipeline reports itself here instead of waiting to be asked.
        # EXPECT_BRAIN_API is what makes an unreachable Gemini fatal here; without
        # the key forwarded, the watchdog could only guess, and guessing filed a
        # false alarm every night.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPECT_BRAIN_API: "1"
        run: |
          python -m scripts.pipeline_watchdog
