# Daily check that the scheduled workflows actually run.
#
# Why: the Community Tab workflow had zero runs in its entire life. It showed as
# "active", its YAML was valid, and nothing reported a problem — because a
# workflow that never starts never fails. Its publish step also never called an
# API, so even a successful run would have posted nothing while reporting success.
# Both were invisible from the Actions dashboard. This job makes silence visible.

on:
  schedule:
    - cron: "14 20 * * *"   # after the 8:14pm release slot, before the 3:14am expansion
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write          # the watchdog opens/closes one tracking issue

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Are the crons firing?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m scripts.automation_health || true

      - name: File or close the stall issue
        # The owner is not watching the Actions tab. An issue is an email, so the
        # pipeline reports itself here instead of waiting to be asked.
        # EXPECT_BRAIN_API is what makes an unreachable Gemini fatal here; without
        # the key forwarded, the watchdog could only guess, and guessing filed a
        # false alarm every night.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EXPECT_BRAIN_API: "1"
        run: |
          python -m scripts.pipeline_watchdog
