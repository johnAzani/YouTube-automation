name: Gemini Brain Autonomous Queue Replenishment

on:
  schedule:
    # Runs daily at 03:14 UTC (3 hours ahead of morning produce.yml cron)
    - cron: "14 3 * * *"   # 4:14am Nigeria time, before the 7:14am production run
  workflow_dispatch:
    inputs:
      force_generate:
        description: "Force generation of next scripture devotional regardless of runway"
        type: boolean
        default: false
      channel:
        description: "Channel to replenish (schedule runs all provisioned channels)"
        type: choice
        options: [both, secret-place, prayer2, prayer3, prayer4, prayer5, prayer6, prayer7, prayer8, prayer9, prayer10]
        default: both

permissions:
  contents: write
  issues: write

concurrency:
  group: content-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          # Same readiness probe as produce.yml: a channel is replenished on a
          # schedule only once its own Gemini key exists. Authoring without a key
          # is not a capability gap — it is an unmetered channel spending nothing,
          # and it would fail loudly every day until the owner provisions it.
          PRAYER3_READY: ${{ secrets.PRAYER3_GEMINI_API_KEY != '' }}
          PRAYER4_READY: ${{ secrets.PRAYER4_GEMINI_API_KEY != '' }}
          PRAYER5_READY: ${{ secrets.PRAYER5_GEMINI_API_KEY != '' }}
          PRAYER6_READY: ${{ secrets.PRAYER6_GEMINI_API_KEY != '' }}
          PRAYER7_READY: ${{ secrets.PRAYER7_GEMINI_API_KEY != '' }}
          PRAYER8_READY: ${{ secrets.PRAYER8_GEMINI_API_KEY != '' }}
          PRAYER9_READY: ${{ secrets.PRAYER9_GEMINI_API_KEY != '' }}
          PRAYER10_READY: ${{ secrets.PRAYER10_GEMINI_API_KEY != '' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import json, os
          from pipeline.channels import normalize_channel_id, scheduled_channels
          provisioned = ["secret-place", "prayer2"]
          if os.environ.get("PRAYER3_READY", "").lower() == "true":
              provisioned.append("prayer3")
          if os.environ.get("PRAYER4_READY", "").lower() == "true":
              provisioned.append("prayer4")
          if os.environ.get("PRAYER5_READY", "").lower() == "true":
              provisioned.append("prayer5")
          if os.environ.get("PRAYER6_READY", "").lower() == "true":
              provisioned.append("prayer6")
          if os.environ.get("PRAYER7_READY", "").lower() == "true":
              provisioned.append("prayer7")
          if os.environ.get("PRAYER8_READY", "").lower() == "true":
              provisioned.append("prayer8")
          if os.environ.get("PRAYER9_READY", "").lower() == "true":
              provisioned.append("prayer9")
          if os.environ.get("PRAYER10_READY", "").lower() == "true":
              provisioned.append("prayer10")
          event = os.environ.get("EVENT_NAME", "")
          inp = (os.environ.get("INPUT_CHANNEL") or "both").strip()
          if event == "workflow_dispatch" and inp not in ("", "both"):
              channels = [inp]
          else:
              channels = provisioned
          allowed = set(scheduled_channels())
          channels = [normalize_channel_id(cid) for cid in channels]
          blocked = [cid for cid in channels if cid not in allowed]
          if blocked and event == "workflow_dispatch" and inp not in ("", "both"):
              raise SystemExit("Refusing unknown or inactive channel(s): " + ", ".join(blocked))
          if blocked:
              print("::notice::Skipping unknown or inactive channel(s): " + ", ".join(blocked))
              channels = [cid for cid in channels if cid in allowed]
          payload = json.dumps(channels)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"channels={payload}\n")
          print(f"Brain plan: {payload}")
          PY

  brain-replenish:
    needs: plan
    if: ${{ needs.plan.outputs.channels != '[]' && needs.plan.outputs.channels != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    env:
      CHANNEL_ID: ${{ matrix.channel }}
      # Each channel's authoring uses its own Gemini project/quota pool.
      GEMINI_API_KEY: ${{ contains(fromJSON('["secret-place","prayer2","prayer3","prayer4","prayer5","prayer6","prayer7","prayer8","prayer9","prayer10"]'), matrix.channel) && secrets[format('{0}GEMINI_API_KEY', fromJSON('{"secret-place":"","prayer2":"PRAYER2_","prayer3":"PRAYER3_","prayer4":"PRAYER4_","prayer5":"PRAYER5_","prayer6":"PRAYER6_","prayer7":"PRAYER7_","prayer8":"PRAYER8_","prayer9":"PRAYER9_","prayer10":"PRAYER10_"}')[matrix.channel])] || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Advance to latest main and snapshot starting tree
        run: |
          git pull --ff-only origin main || true
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: ./.github/actions/setup-render-deps

      - name: Can this runner reach Gemini?
        id: preflight
        # A wrong answer here is expensive. GEMINI_API_KEY has been configured since
        # week one and narrates every video; authoring reported "key unavailable"
        # whenever the client failed for an unrelated reason. Prove the call first.
        run: python scripts/gemini_brain.py --preflight

      - name: Keep the long-form queue publishable
        id: supply
        # One command for every channel — the channel is data, so there is no
        # per-channel branch to drift. It lengthens approved-but-short scripts,
        # then authors only if the queue still lacks runway. Exits non-zero when
        # nothing can publish, which is the point: a stalled queue must not look
        # like a satisfied one. Each channel is counted and authored separately,
        # with its own Gemini quota pool; free-tier exhaustion (429) therefore
        # idles only that channel and never spends money or borrows the other
        # channel's quota ($0 lock).
        # Run Shorts authoring and commit even when long-form only partially
        # replenished so newly authored scripts are never discarded; the final
        # gate below still fails the job if supply failed.
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/gemini_brain.py --ensure-supply-for "$CHANNEL_ID" --min-publishable 6 2>&1 | tee supply.log

      - name: Author specs for Shorts that cannot render yet
        # Every channel authors its own Shorts: manifests name their channel, so a
        # spec or an upload can never be dressed in the other channel's branding.
        # A blocked spec must not stop the long-form replenishment in the same run;
        # the step summary and automation_health both report what stayed blocked.
        continue-on-error: true
        run: python scripts/gemini_brain.py --author-shorts 2>&1 | tee shorts.log

      - name: Force one more authored edition (manual dispatch only)
        if: ${{ inputs.force_generate == true }}
        run: |
          set -o pipefail
          python scripts/gemini_brain.py --channel "$CHANNEL_ID" --generate-next 2>&1 | tee brain.log

      - name: Summarise supply and Short authoring
        if: always()
        run: |
          if [ -s supply.log ]; then
            echo "### 📜 Long-form Supply" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -v '^\[run\]' supply.log | tail -40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s shorts.log ]; then
            echo "### 🎞 Short Scene Specs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat shorts.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Refresh factcheck worksheets before commit
        if: ${{ steps.preflight.outcome == 'success' && !cancelled() }}
        run: python scripts/factcheck.py --all

      - name: Commit newly authored queue items
        if: ${{ steps.preflight.outcome == 'success' && !cancelled() }}
        run: |
          set -e
          git config user.name "gemini-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          base_ref="${START_SHA:-HEAD}"
          git diff --name-only --diff-filter=D "$base_ref" -- \
            content/queue/ content/shorts-queue/ content/shorts-scripts/ content/factcheck/ \
            > /tmp/brain-deleted.txt
          {
            git diff --name-only --diff-filter=ACMR "$base_ref" -- \
              content/queue/ content/shorts-queue/ content/shorts-scripts/ content/factcheck/
            git ls-files --others --exclude-standard -- \
              content/queue/ content/shorts-queue/ content/shorts-scripts/ content/factcheck/
          } | sort -u > /tmp/brain-touched.txt
          if [ ! -s /tmp/brain-deleted.txt ] && [ ! -s /tmp/brain-touched.txt ]; then
            echo "### 🧠 Gemini Brain Queue Audit" >> "$GITHUB_STEP_SUMMARY"
            echo "Queue runway is healthy. No replenishment needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --mixed origin/main
            # A PR or another writer can commit while this run is authoring.
            # Never stage stale output over newer work or a reused roadmap ID.
            python scripts/guard_brain_commit.py --base "$base_ref" \
              --touched /tmp/brain-touched.txt --deleted /tmp/brain-deleted.txt
            while IFS= read -r p; do
              [ -n "$p" ] && git rm --cached --ignore-unmatch --quiet -- "$p"
            done < /tmp/brain-deleted.txt
            while IFS= read -r p; do
              [ -n "$p" ] && [ -e "$p" ] && git add -- "$p"
            done < /tmp/brain-touched.txt
            if git diff --cached --quiet; then
              echo "### 🧠 Gemini Brain Queue Audit" >> "$GITHUB_STEP_SUMMARY"
              echo "Queue runway is healthy. No replenishment needed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m "chore(brain): autonomous scripture queue replenishment [skip ci]"
            if git push origin HEAD:main; then
              echo "### 🧠 Gemini Brain Staged New Devotional" >> "$GITHUB_STEP_SUMMARY"
              echo "New scripture devotional and companion Short authored and armed for production." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report long-form supply outcome
        if: ${{ steps.supply.outcome == 'failure' }}
        run: exit 1
