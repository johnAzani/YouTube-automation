name: Gemini Brain Autonomous Queue Replenishment

on:
  schedule:
    # Runs daily at 03:14 UTC (3 hours ahead of morning produce.yml cron)
    - cron: "14 3 * * *"   # 4:14am Nigeria time, before the 7:14am production run
  workflow_dispatch:
    inputs:
      force_generate:
        description: "Force generation of next scripture devotional regardless of runway"
        type: boolean
        default: false
      channel:
        description: "Channel to replenish (schedule runs both)"
        type: choice
        options: [both, secret-place, prayer2, prayer3]
        default: both

permissions:
  contents: write
  issues: write

concurrency:
  group: content-state
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - id: plan
        env:
          # Same readiness probe as produce.yml: a channel is replenished on a
          # schedule only once its own Gemini key exists. Authoring without a key
          # is not a capability gap — it is an unmetered channel spending nothing,
          # and it would fail loudly every day until the owner provisions it.
          PRAYER3_READY: ${{ secrets.PRAYER3_GEMINI_API_KEY != '' }}
        run: |
          provisioned='["secret-place","prayer2"]'
          if [ "$PRAYER3_READY" = "true" ]; then
            provisioned='["secret-place","prayer2","prayer3"]'
          fi
          case "${{ github.event_name }}" in
            schedule)          channels="$provisioned" ;;
            workflow_dispatch) case "${{ inputs.channel }}" in
                                 both) channels="$provisioned" ;;
                                 *)    channels='["${{ inputs.channel }}"]' ;;
                               esac ;;
            *)                 channels="$provisioned" ;;
          esac
          echo "channels=$channels" >> "$GITHUB_OUTPUT"
          echo "Brain plan: $channels"

  brain-replenish:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    env:
      CHANNEL_ID: ${{ matrix.channel }}
      # Morning Altar authoring uses its own Gemini project/quota pool.
      GEMINI_API_KEY: ${{ matrix.channel == 'prayer3' && secrets.PRAYER3_GEMINI_API_KEY || (matrix.channel == 'prayer2' && secrets.PRAYER2_GEMINI_API_KEY || secrets.GEMINI_API_KEY) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: ./.github/actions/setup-render-deps

      - name: Can this runner reach Gemini?
        # A wrong answer here is expensive. GEMINI_API_KEY has been configured since
        # week one and narrates every video; authoring reported "key unavailable"
        # whenever the client failed for an unrelated reason. Prove the call first.
        run: python scripts/gemini_brain.py --preflight

      - name: Keep the long-form queue publishable
        # One command for every channel — the channel is data, so there is no
        # per-channel branch to drift. It lengthens approved-but-short scripts,
        # then authors only if the queue still lacks runway. Exits non-zero when
        # nothing can publish, which is the point: a stalled queue must not look
        # like a satisfied one. Each channel is counted and authored separately,
        # with its own Gemini quota pool; free-tier exhaustion (429) therefore
        # idles only that channel and never spends money or borrows the other
        # channel's quota ($0 lock).
        run: |
          set -o pipefail
          python scripts/gemini_brain.py --ensure-supply-for "$CHANNEL_ID" --min-publishable 6 2>&1 | tee supply.log

      - name: Author specs for Shorts that cannot render yet
        # Every channel authors its own Shorts: manifests name their channel, so a
        # spec or an upload can never be dressed in the other channel's branding.
        # A blocked spec must not stop the long-form replenishment in the same run;
        # the step summary and automation_health both report what stayed blocked.
        continue-on-error: true
        run: python scripts/gemini_brain.py --author-shorts 2>&1 | tee shorts.log

      - name: Force one more authored edition (manual dispatch only)
        if: ${{ inputs.force_generate == true }}
        run: |
          set -o pipefail
          python scripts/gemini_brain.py --channel "$CHANNEL_ID" --generate-next 2>&1 | tee brain.log

      - name: Summarise supply and Short authoring
        if: always()
        run: |
          if [ -s supply.log ]; then
            echo "### 📜 Long-form Supply" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -v '^\[run\]' supply.log | tail -40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -s shorts.log ]; then
            echo "### 🎞 Short Scene Specs" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat shorts.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit newly authored queue items
        run: |
          set -e
          git config user.name "gemini-brain-bot"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --mixed origin/main
            git add content/queue/ content/shorts-queue/ content/shorts-scripts/ content/factcheck/
            if git diff --cached --quiet; then
              echo "### 🧠 Gemini Brain Queue Audit" >> "$GITHUB_STEP_SUMMARY"
              echo "Queue runway is healthy. No replenishment needed." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git commit -m "chore(brain): autonomous scripture queue replenishment [skip ci]"
            if git push origin HEAD:main; then
              echo "### 🧠 Gemini Brain Staged New Devotional" >> "$GITHUB_STEP_SUMMARY"
              echo "New scripture devotional and companion Short authored and armed for production." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
