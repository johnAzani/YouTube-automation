name: Produce video

# LIVE PRODUCTION WORKFLOW — Executes scheduled publishing to YouTube.
# NOTE: To prevent accidental, unintentional, or duplicate uploads from git commits,
# production uploads only run on the official release cron schedule or manual dispatch.
on:
  schedule:
    # Daily release slots for BOTH channels (the plan job below expands a
    # scheduled run to secret-place + prayer2, produced sequentially):
    # 1. 06:14 UTC — Morning scripture devotional (07:14 WAT)
    # 2. 14:14 UTC — US afternoon / transatlantic priming (15:14 WAT / 10:14 EST)
    # 3. 19:14 UTC — Peak evening bedtime prayer sanctuary (20:14 WAT / 8:14pm local)
    - cron: "14 6 * * *"    # 7:14am Nigeria time
    - cron: "14 14 * * *"  # 3:14pm Nigeria time
    - cron: "14 19 * * *"  # 8:14pm Nigeria time (the 19:14 release slot)
  # The owner's "run it now" button, and the only trigger reachable without
  # Actions-write on the API: `workflow_dispatch` needs a token this account's
  # integration does not hold, while `repository_dispatch` needs only contents
  # write. One call starts a release:
  #
  #   gh api --method POST repos/johnAzani/YouTube-automation/dispatches \
  #          -f event_type=publish-now
  #
  # Safe to fire repeatedly: the release checks the channel before it renders
  # anything, so a second dispatch records the first one's video instead of
  # re-uploading it.
  repository_dispatch:
    types: [publish-now]
  workflow_dispatch:
    inputs:
      channel:
        description: "Target channel (each uses its own GCP project, quota & secrets)"
        type: choice
        options: [secret-place, prayer2, prayer3]
        default: secret-place
      job:
        description: "Specific script file in content/queue/ (blank = next approved)"
        required: false
        default: ""
      short:
        description: "Authored 9:16 Short key to render & upload (e.g. short-enron)"
        required: false
        default: ""
      dry_run:
        description: "Render only, skip upload"
        type: boolean
        default: false
      allow_duplicate:
        description: "Replacement run: upload even though a video with this title exists (job 0036 re-queue; leave OFF otherwise)"
        type: boolean
        default: false

permissions:
  contents: write        # move queue file / record published receipt in content/published/
  issues: write          # release tickets

# Production, the brain and the supervisor all commit into content/. Two of them
# pushing at once is how the queue state was lost on 2 November: the supervisor
# committed its dispatch ledger, production's `git push` was rejected, the move to
# content/published/ never landed, and the next run could have re-uploaded the
# same video. One content-state lock for all of them.
concurrency:
  group: content-state
  cancel-in-progress: false

jobs:
  plan:
    # Which channels this run produces. A scheduled slot serves BOTH
    # channels (owner decision, 2026-11-05: The Morning Altar runs on the
    # same schedule and public/auto-publish terms as The Secret Place);
    # a manual dispatch serves exactly the channel it was given; the
    # repository_dispatch "publish-now" button stays Secret Place only.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          # A channel joins the scheduled slots the moment its own credentials
          # exist — no code change and no per-channel switch.
          PRAYER3_READY: ${{ secrets.PRAYER3_YOUTUBE_REFRESH_TOKEN != '' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          sys.path.insert(0, ".")
          from scripts.automation_monitor import active_quota_cooldown

          event = os.environ.get("EVENT_NAME", "")
          p3_ready = os.environ.get("PRAYER3_READY", "").lower() == "true"
          if event == "schedule":
              candidates = ["secret-place", "prayer2"]
              if p3_ready:
                  candidates.append("prayer3")
              else:
                  print(
                      "::notice title=prayer3 waits for credentials::"
                      "PRAYER3_YOUTUBE_REFRESH_TOKEN is not set, so The Midday Watch "
                      "is registered but not yet scheduled."
                  )
              now = datetime.now(timezone.utc)
              channels = []
              for cid in candidates:
                  reset = active_quota_cooldown(now, channel_id=cid)
                  if reset is not None:
                      print(
                          f"::notice title={cid} in daily TTS quota cooldown::"
                          f"Skipping scheduled leg until {reset.isoformat()} UTC ($0.00 lock)."
                      )
                      continue
                  channels.append(cid)
          elif event == "workflow_dispatch":
              channels = [(os.environ.get("INPUT_CHANNEL") or "secret-place").strip()]
          else:
              channels = ["secret-place"]

          payload = json.dumps(channels)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"channels={payload}\n")
          print(f"producing for: {payload}")
          PY

  produce:
    needs: plan
    if: ${{ needs.plan.outputs.channels != '[]' && needs.plan.outputs.channels != '' }}
    # One channel at a time: both legs write content/ state to main, and
    # the queue-state commit assumes it is the only producer running.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    runs-on: ubuntu-latest     # public repo: 4-core/16GB, free & unlimited
    # Must exceed the sum of the step caps below, or the job kills itself before
    # any step reaches its own limit. It was 120 while the steps summed to 140:
    # the 0017 release died at the job boundary with the render still inside its
    # budget. 240 leaves room for checkout, deps, alignment model and the report
    # steps on top of 30 + 20 + 170.
    timeout-minutes: 240
    env:
      DRY_RUN: ${{ (inputs.dry_run || false) && '1' || '0' }}
      # Channel for this matrix leg (see the plan job): scheduled runs do
      # every provisioned channel in sequence, manual runs do the selected one. Each
      # channel's own PRAYER3_* / PRAYER2_* / unprefixed secrets are mapped onto the
      # canonical names below, so credentials are never mixed.
      CHANNEL_ID: ${{ matrix.channel || 'secret-place' }}
      CHANNEL_NAME: ${{ matrix.channel == 'prayer3' && 'The Midday Watch' || (matrix.channel == 'prayer2' && 'The Morning Altar' || 'The Secret Place') }}
      CHANNEL_HANDLE: ${{ matrix.channel == 'prayer3' && '@TheMiddayWatch' || (matrix.channel == 'prayer2' && '@TheMorningAltarDaily' || '@TheSecretPlace') }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ matrix.channel == 'prayer3' && secrets.PRAYER3_YOUTUBE_CLIENT_ID || (matrix.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID) }}
      YOUTUBE_CLIENT_SECRET: ${{ matrix.channel == 'prayer3' && secrets.PRAYER3_YOUTUBE_CLIENT_SECRET || (matrix.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET) }}
      YOUTUBE_REFRESH_TOKEN: ${{ matrix.channel == 'prayer3' && secrets.PRAYER3_YOUTUBE_REFRESH_TOKEN || (matrix.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN) }}
      YOUTUBE_PLAYLIST_ID: ${{ matrix.channel == 'prayer3' && secrets.PRAYER3_YOUTUBE_PLAYLIST_ID || (matrix.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_PLAYLIST_ID || secrets.YOUTUBE_PLAYLIST_ID) }}
      YOUTUBE_EXPECTED_CHANNEL_ID: ${{ matrix.channel == 'prayer3' && (vars.PRAYER3_YOUTUBE_CHANNEL_ID || secrets.PRAYER3_YOUTUBE_CHANNEL_ID) || (matrix.channel == 'prayer2' && (vars.PRAYER2_YOUTUBE_CHANNEL_ID || secrets.PRAYER2_YOUTUBE_CHANNEL_ID) || (vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID)) }}
      # Both channels publish on the same terms (owner decision 2026-11-05):
      # The Morning Altar is public + auto-publish, like The Secret Place.
      AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH || 'true' }}
      # Deliberate replacement runs only (e.g. re-rendered narration). Surfaced
      # as an explicit tick-box so a replacement is a conscious, logged choice —
      # never a repo-wide secret silently left on. Default stays shielded.
      ALLOW_DUPLICATE_UPLOADS: ${{ (inputs.allow_duplicate || false) && 'true' || 'false' }}
      DEFAULT_PRIVACY: public
      GEMINI_API_KEY: ${{ matrix.channel == 'prayer3' && secrets.PRAYER3_GEMINI_API_KEY || (matrix.channel == 'prayer2' && secrets.PRAYER2_GEMINI_API_KEY || secrets.GEMINI_API_KEY) }}
      # pipeline.run shells out to `gh issue create` for the release ticket
      # (SETUP.md §6.4). gh needs a token: without GH_TOKEN the call fails
      # unauthenticated and the QC issue would silently never appear.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Snapshot starting commit for isolated content staging
        run: echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Python deps first, then a bounded best-effort apt ffmpeg + fonts. See the
      # action's header for the 2026-10-23 job-timeout this replaces.
      - uses: ./.github/actions/setup-render-deps

      # Local CPU word alignment, no paid transcription service. The model is
      # downloaded only to runner storage and never committed to the repository.
      - name: Cache offline word-alignment model
        uses: actions/cache@v4
        with:
          path: output/alignment-model
          key: whisper-small-en-v1

      - name: Install and verify speech alignment
        run: |
          python -m pip install 'faster-whisper==1.2.1' 'av<19' 'huggingface-hub<1'
          if [ ! -f output/alignment-model/model.bin ]; then
            python - <<'PYMODEL'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='Systran/faster-whisper-small.en', local_dir='output/alignment-model')
          PYMODEL
          fi
          python scripts/check_prayer_alignment.py --model output/alignment-model

      - name: Restore stock-asset cache
        uses: actions/cache@v4
        with:
          path: output/asset_cache
          key: assets-v2-${{ hashFiles('tools/shorts.py', 'pipeline/assets.py') }}
          restore-keys: |
            assets-v2-
            assets-

      - name: Restore finished speech chunks
        # The free tier allows TEN text-to-speech requests per day. A six-minute
        # prayer needs two; a bad afternoon can still use three or four. Losing a
        # finished chunk because the step ended is a request the channel cannot
        # afford, so finished chunks and Short narrations are restored here and
        # saved via actions/cache/save@v4 (if: always()) below even on failure.
        uses: actions/cache/restore@v4
        with:
          path: |
            output/*/_gemini_chunks_*
            assets/deepdive/short-*.mp3
            assets/deepdive/words-short-*.json
          key: chunks-tts-v4-${{ matrix.channel }}-${{ github.run_id }}
          restore-keys: |
            chunks-tts-v4-${{ matrix.channel }}-
            chunks-

      # Second safety net. If the brain's cron was delayed, skipped, or its API call
      # failed, this run repairs the queue itself instead of printing "nothing to
      # do" and exiting green. When the queue is already publishable it costs
      # nothing: it only lengthens backlog scripts, up to a small daily budget.
      - name: Repair the queue before publishing
        id: supply
        # Non-blocking on purpose: a Short can still upload when the long-form queue
        # is empty, and killing the run first would lose that upload. The alarm for
        # "nothing is publishable" is the watchdog at the end of this job.
        continue-on-error: true
        # Queue repair is channel-scoped and identical on every channel: each leg
        # lengthens/authors only its own channel's scripts, with its own Gemini
        # quota pool. Non-blocking + the empty-queue gate below mean exhaustion
        # idles this leg green.
        if: ${{ inputs.short == '' && inputs.job == '' }}
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          python scripts/gemini_brain.py --ensure-supply-for "$CHANNEL_ID" --min-publishable 3 2>&1 | tee supply.log
          { echo "### 📜 Queue repair"; echo '```'; grep -v '^\[run\]' supply.log | tail -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Check this channel's queue
        # Evaluated *after* queue repair so a script freshly authored or lengthened
        # by `--ensure-supply-for` can publish immediately in this same run.
        id: channel_queue
        if: ${{ inputs.job == '' && inputs.short == '' }}
        run: |
          python - <<'PYQUEUE'
          import os

          from pipeline.run import select_jobs

          channel = os.environ["CHANNEL_ID"]
          jobs = select_jobs(False, None, True)
          has_job = bool(jobs)
          print(f"{channel} next publishable job: {jobs[0] if has_job else 'none'}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_job={str(has_job).lower()}\n")
          if not has_job:
              print(f"::notice title={channel} queue empty::No approved {channel} "
                    f"script is ready, so this leg uploads nothing. Its brain "
                    f"supplies approved scripts to content/queue/ for this "
                    f"channel only; the next slot will publish the first one "
                    f"it queues.")
          PYQUEUE

      - name: Render the Short (9:16)
        # The Short is the ride-along, never the release. Two things follow: its
        # failure is a warning rather than a red run, and it gets its own bounded
        # timeout instead of living inside one opaque 30-minute step.
        continue-on-error: true
        timeout-minutes: 30
        # Every channel renders and uploads its own Shorts: manifests carry their
        # channel and the selector filters by this leg's CHANNEL_ID, so a Short can
        # never be uploaded to the wrong channel.
        if: ${{ inputs.job == '' }}
        run: |
          set +e
          set -o pipefail
          if [ -n "${{ inputs.short }}" ]; then
            python -m pipeline.short_release --short "${{ inputs.short }}" 2>&1 | tee short.log
          else
            python -m pipeline.short_release --next 2>&1 | tee short.log
          fi
          rc=$?
          {
            echo "### Short (exit $rc)"
            echo '```'
            tail -n 25 short.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Short did not render::pipeline.short_release exited $rc (a Short never blocks the release)"
            exit "$rc"
          fi

      - name: Record videos that are live but not yet in the repo
        # A publish whose commit failed leaves the script in the queue looking new.
        # Recovering it is fast when the video exists and costs nothing when it does
        # not — but on 2 November it ran inside the release step, so a thumbnail
        # repair and a 45-minute render shared one 90-minute budget. Both runs that
        # afternoon timed out at exactly 90:00 with a video live and unrecorded, and
        # the next slot inherited the same problem. Its own step, its own timeout.
        id: record
        timeout-minutes: 20
        continue-on-error: true
        if: ${{ inputs.short == '' && inputs.job == '' }}
        run: |
          set +e
          set -o pipefail
          python -m pipeline.run --record-published 2>&1 | tee record.log
          rc=$?
          { echo "### Receipts for already-live videos (exit $rc)"; echo '```';
            grep -v '^\[run\] ⏳' record.log | tail -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Render and upload the long-form edition
        # This is the release. Before it was merged with the Short into one step,
        # a 30-minute render and a wedged render looked identical: one opaque
        # "in progress" with nothing in the log until it ended. Its own timeout
        # means a wedged render fails the run at a named step, well inside the
        # job's 120-minute cap.
        # A 5:22 edition measures ~170 ms per frame on a runner (7,700 frames ≈
        # 22 min) plus speech, alignment, asset fetch and upload; the slowest
        # observed release was still inside 90 minutes only because earlier
        # editions were shorter. 170 covers the measured worst case with room for
        # a slow runner, and the per-stage progress lines now say where the time
        # went if it ever comes close.
        timeout-minutes: 170
        if: ${{ inputs.short == '' && (inputs.job != '' || steps.channel_queue.outputs.has_job == 'true') }}
        env:
          # An append-only trail of what this step was doing, written as it runs.
          # The step summary needs a GitHub sign-in to read and the log archive is
          # unreachable from automation, so this file is what lets the reporter
          # below quote the run back as an issue we can actually read.
          PROGRESS_TRAIL: output/progress-trail.log
        run: |
          set +e
          set -o pipefail
          if [ -n "${{ inputs.job }}" ]; then
            python -m pipeline.run --job "content/queue/${{ inputs.job }}" 2>&1 | tee run.log
          else
            python -m pipeline.run --next 2>&1 | tee run.log
          fi
          rc=$?
          {
            echo "### Long-form release (exit $rc)"
            echo '```'
            tail -n 60 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 3 ]; then
            if python -c "import os; from datetime import datetime, timedelta, timezone; from scripts.pipeline_watchdog import last_publish_for_channel; lp=last_publish_for_channel(os.environ.get('CHANNEL_ID','secret-place')); raise SystemExit(0 if (lp and datetime.now(timezone.utc) - lp[1] < timedelta(hours=24)) else 1)"; then
              echo "::notice title=Daily free-tier quota cooldown (${CHANNEL_ID})::Channel already published within the last 24h; long-form edition paused cleanly until next daily reset ($0.00 lock)."
              exit 0
            fi
          fi
          if [ "$rc" -ne 0 ]; then
            tail -n 15 run.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: Close resolved release failure issues
        if: ${{ success() && inputs.short == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python -m scripts.release_report --close-resolved || true

      - name: Say where the release died
        # Scheduling note for future editors: a scheduled run is one workflow
        # run with two sequential channel legs, and the Morning Altar leg is
        # allowed to idle green on an empty queue (see the queue check above).
        # Do not "fix" that by failing the leg — a false failure here would
        # page the owner three times a day for a supply gap, not a breakage.
        # `gh run view --log-failed` returns "failed to get run log … EOF" for
        # these runs and the run page is behind a sign-in, so three consecutive
        # 90-minute timeouts were undiagnosable. The trail written during the run
        # is turned into an issue, which both the owner and the automation can read.
        # `cancelled()` as well as `failure()`. A run killed by the supervisor — or
        # by a human clicking Cancel — is not a `failure()`, so the report step was
        # skipped exactly when it was most needed: 41540026963 was cancelled at
        # minute 167 of the render and filed nothing at all.
        if: ${{ cancelled() || failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          python -m scripts.release_report --trail output/progress-trail.log \
            --log run.log --issue || true

      - name: Report a stall if the queues are empty
        # Runs even when the render failed: that is precisely when the owner needs
        # to hear about it, and an issue is an email.
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_BRAIN_API: "1"
        run: python -m scripts.pipeline_watchdog || true

      - name: Commit queue state (job moved to published/)
        # Losing this commit is not cosmetic: the published/ move is what stops the
        # next run from uploading the same video again. On 2 November it failed five
        # times in a row — `git pull --rebase` hit the same conflict on every retry,
        # so the retry loop could never win, and a video that was live on the channel
        # left no record in the repo.
        #
        # The fix is to stop rebasing. Re-point HEAD at the current main, stage our
        # content/ working tree on top of it, and commit: there is no merge, so there
        # is no conflict to loop on. Repeat only if main moves underneath us.
        if: ${{ always() && !cancelled() }}
        run: |
          set -e
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          base_ref="${START_SHA:-HEAD}"
          git diff --name-only --diff-filter=D "$base_ref" -- content/ > /tmp/produce-deleted.txt
          {
            git diff --name-only --diff-filter=ACMR "$base_ref" -- content/
            git ls-files --others --exclude-standard -- content/
          } | sort -u > /tmp/produce-touched.txt
          if [ ! -s /tmp/produce-deleted.txt ] && [ ! -s /tmp/produce-touched.txt ]; then
            echo "queue state unchanged (nothing to record)"
            exit 0
          fi
          for attempt in 1 2 3 4 5 6; do
            git fetch --quiet origin main
            git reset --mixed origin/main
            while IFS= read -r p; do
              [ -n "$p" ] && git rm --cached --ignore-unmatch --quiet -- "$p"
            done < /tmp/produce-deleted.txt
            while IFS= read -r p; do
              [ -n "$p" ] && [ -e "$p" ] && git add -- "$p"
            done < /tmp/produce-touched.txt
            if git diff --cached --quiet; then
              echo "queue state unchanged (nothing to record)"
              exit 0
            fi
            git commit --quiet -m "chore(content): publish job [skip ci]"
            if git push --quiet origin HEAD:main; then
              echo "queue state recorded on attempt $attempt"
              exit 0
            fi
            echo "::warning::main moved during attempt $attempt; re-staging on the new tip"
            sleep $((attempt * 3))
          done
          echo "::error title=Queue state lost::could not record the published/ move; the next run may re-upload the same video"
          exit 1

      - name: Save finished speech chunks (even on quota pause or failure)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            output/*/_gemini_chunks_*
            assets/deepdive/short-*.mp3
            assets/deepdive/words-short-*.json
          key: chunks-tts-v4-${{ matrix.channel }}-${{ github.run_id }}

      # Style proof without a 1 GB download: three frames from the master,
      # small enough to open from the run page. Shows HUD, typography,
      # gold illumination and how the plate fills a 16:9 frame.
      - name: Extract style frames from the master
        if: always()
        run: |
          set +e
          mkdir -p output/style-frames
          for f in output/*/*.mp4; do
            [ -f "$f" ] || continue
            case "$f" in output/asset_cache/*|output/alignment-model/*) continue ;; esac
            specs=$(ffmpeg -hide_banner -i "$f" 2>&1 | grep -E 'Duration|Stream #' | tr -s ' ' | tr '\n' '/')
            echo "::notice title=Master::$(basename "$f") | $specs"
            dur=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f" 2>/dev/null)
            for pct in 10 50 90; do
              sec=$(python -c "d=float('${dur:-0}' or 0); print(f'{max(0.5, d * $pct / 100.0):.2f}')")
              ffmpeg -y -loglevel error -ss "$sec" -i "$f" -frames:v 1 \
                -vf "scale=960:-2" "output/style-frames/$(basename "$f" .mp4)-${pct}pct.png"
            done
          done
          ls -la output/style-frames || true

      - name: Upload style frames (review artifact, 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-frames-${{ github.run_id }}-${{ matrix.channel }}
          path: output/style-frames/
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect the run's own report (small, readable from the API)
        # The full render artifact is ~1 GB and the log archive is unreachable from
        # automation, so a green run could not be interrogated at all: on 3 November
        # the 07:27 release finished green in four minutes with nothing uploaded and
        # there was no way — from the API — to ask it what it had done. These are
        # kilobytes and they answer every question: which job was picked, how long
        # each stage took, and what the release decided.
        if: always()
        run: |
          set +e
          mkdir -p output/report
          for f in run.log short.log record.log supply.log output/progress-trail.log; do
            [ -f "$f" ] && cp "$f" "output/report/$(basename "$f")" 2>/dev/null
          done
          for d in output/*/job_result.json; do
            [ -f "$d" ] || continue
            slug=$(basename "$(dirname "$d")")
            cp "$d" "output/report/job_result-$slug.json"
          done
          python - <<'PYREPORT'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          report = {"generated_at": datetime.now(timezone.utc).isoformat(),
                    "run_id": os.environ.get("GITHUB_RUN_ID"),
                    "event": os.environ.get("GITHUB_EVENT_NAME"),
                    "queue": sorted(p.name for p in Path("content/queue").glob("*.md")),
                    "published": sorted(p.name for p in Path("content/published").glob("*.md")),
                    "results": []}
          for path in sorted(Path("output").glob("*/job_result.json")):
              try:
                  report["results"].append(json.loads(path.read_text()))
              except Exception:
                  pass
          Path("output/report").mkdir(parents=True, exist_ok=True)
          Path("output/report/summary.json").write_text(json.dumps(report, indent=2))

          # Also as annotations. The artifact itself lives on a host that automation
          # cannot reach (the same host as the log archive), so the report has to be
          # readable through the API that *is* reachable: `::notice` lines.
          stage_lines = []
          trail = Path("output/progress-trail.log")
          if trail.is_file():
              for line in trail.read_text(errors="replace").splitlines():
                  if any(mark in line for mark in ("▶", "✓", "✗")):
                      stage_lines.append(line.strip())
          if stage_lines:
              print("::notice title=Stages::" + " | ".join(stage_lines[-8:]))
          for res in report["results"][-2:]:
              print("::notice title=Job result::" + json.dumps(res)[:900])
          print(f"::notice title=Queues::queued={len(report['queue'])} "
                f"published={len(report['published'])} event={report['event']}")
          PYREPORT
          ls -la output/report || true

      - name: Upload the run report (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-report-${{ github.run_id }}-${{ matrix.channel }}
          path: output/report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload render for QC (expires in 1 day — videos never live in git)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ github.run_id }}-${{ matrix.channel }}
          path: |
            output/
            !output/asset_cache/**
            !output/alignment-model/**
            !output/*/_gemini_chunks_*/**
          retention-days: 1
