name: Produce video

# LIVE PRODUCTION WORKFLOW — Executes scheduled publishing to YouTube.
# NOTE: To prevent accidental, unintentional, or duplicate uploads from git commits,
# production uploads only run on the official release cron schedule or manual dispatch.
on:
  schedule:
    # Daily release slots:
    # 1. 06:14 UTC — Morning scripture devotional (07:14 WAT)
    # 2. 14:14 UTC — US afternoon / transatlantic priming (15:14 WAT / 10:14 EST)
    # 3. 19:14 UTC — Peak evening bedtime prayer sanctuary (20:14 WAT / 8:14pm local)
    - cron: "14 6 * * *"    # 7:14am Nigeria time
    - cron: "14 14 * * *"  # 3:14pm Nigeria time
    - cron: "14 19 * * *"  # 8:14pm Nigeria time (the 19:14 release slot)
  workflow_dispatch:
    inputs:
      job:
        description: "Specific script file in content/queue/ (blank = next approved)"
        required: false
        default: ""
      short:
        description: "Authored 9:16 Short key to render & upload (e.g. short-enron)"
        required: false
        default: ""
      dry_run:
        description: "Render only, skip upload"
        type: boolean
        default: false

permissions:
  contents: write        # move queue file / record published receipt in content/published/
  issues: write          # release tickets

# Production, the brain and the supervisor all commit into content/. Two of them
# pushing at once is how the queue state was lost on 2 November: the supervisor
# committed its dispatch ledger, production's `git push` was rejected, the move to
# content/published/ never landed, and the next run could have re-uploaded the
# same video. One content-state lock for all of them.
concurrency:
  group: content-state
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest     # public repo: 4-core/16GB, free & unlimited
    timeout-minutes: 120
    env:
      DRY_RUN: ${{ (inputs.dry_run || false) && '1' || '0' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
      AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH || 'true' }}
      DEFAULT_PRIVACY: "public"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # pipeline.run shells out to `gh issue create` for the release ticket
      # (SETUP.md §6.4). gh needs a token: without GH_TOKEN the call fails
      # unauthenticated and the QC issue would silently never appear.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Python deps first, then a bounded best-effort apt ffmpeg + fonts. See the
      # action's header for the 2026-10-23 job-timeout this replaces.
      - uses: ./.github/actions/setup-render-deps

      # Local CPU word alignment, no paid transcription service. The model is
      # downloaded only to runner storage and never committed to the repository.
      - name: Install and verify speech alignment
        if: ${{ inputs.short == '' }}
        run: |
          python -m pip install 'faster-whisper==1.2.1' 'av<19' 'huggingface-hub<1'
          python - <<'PYMODEL'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='Systran/faster-whisper-small.en', local_dir='output/alignment-model')
          PYMODEL
          python scripts/check_prayer_alignment.py --model output/alignment-model

      - name: Restore stock-asset cache
        uses: actions/cache@v4
        with:
          path: output/asset_cache
          key: assets-${{ hashFiles('content/queue/*.md', 'tools/shorts.py') }}
          restore-keys: |
            assets-

      # Second safety net. If the brain's cron was delayed, skipped, or its API call
      # failed, this run repairs the queue itself instead of printing "nothing to
      # do" and exiting green. When the queue is already publishable it costs
      # nothing: it only lengthens backlog scripts, up to a small daily budget.
      - name: Repair the queue before publishing
        id: supply
        # Non-blocking on purpose: a Short can still upload when the long-form queue
        # is empty, and killing the run first would lose that upload. The alarm for
        # "nothing is publishable" is the watchdog at the end of this job.
        continue-on-error: true
        if: ${{ inputs.short == '' && inputs.job == '' }}
        env:
          GITHUB_ACTIONS: "true"
        run: |
          set -o pipefail
          python scripts/gemini_brain.py --ensure-supply 2>&1 | tee supply.log
          { echo "### 📜 Queue repair"; echo '```'; grep -v '^\[run\]' supply.log | tail -30; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Render the Short (9:16)
        # The Short is the ride-along, never the release. Two things follow: its
        # failure is a warning rather than a red run, and it gets its own bounded
        # timeout instead of living inside one opaque 30-minute step.
        continue-on-error: true
        timeout-minutes: 30
        if: ${{ inputs.job == '' }}
        run: |
          set -o pipefail
          if [ -n "${{ inputs.short }}" ]; then
            python -m pipeline.short_release --short "${{ inputs.short }}" 2>&1 | tee short.log
          else
            python -m pipeline.short_release --next 2>&1 | tee short.log
          fi
          rc=$?
          {
            echo "### Short (exit $rc)"
            echo '```'
            tail -n 25 short.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Short did not render::pipeline.short_release exited $rc (a Short never blocks the release)"
            exit "$rc"
          fi

      - name: Render and upload the long-form edition
        # This is the release. Before it was merged with the Short into one step,
        # a 30-minute render and a wedged render looked identical: one opaque
        # "in progress" with nothing in the log until it ended. Its own timeout
        # means a wedged render fails the run at a named step, well inside the
        # job's 120-minute cap.
        timeout-minutes: 90
        if: ${{ inputs.short == '' }}
        run: |
          set -o pipefail
          if [ -n "${{ inputs.job }}" ]; then
            python -m pipeline.run --job "content/queue/${{ inputs.job }}" 2>&1 | tee run.log
          else
            python -m pipeline.run --next 2>&1 | tee run.log
          fi
          rc=$?
          {
            echo "### Long-form release (exit $rc)"
            echo '```'
            tail -n 60 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            tail -n 15 run.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: Report a stall if the queues are empty
        # Runs even when the render failed: that is precisely when the owner needs
        # to hear about it, and an issue is an email.
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECT_BRAIN_API: "1"
        run: python -m scripts.pipeline_watchdog || true

      - name: Commit queue state (job moved to published/)
        # Losing this commit is not cosmetic: the published/ move is what stops the
        # next run from uploading the same video again. Retry around a moving main
        # instead of dying on the first rejected push.
        if: ${{ always() && !cancelled() }}
        run: |
          set -e
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content/
          if git diff --cached --quiet; then
            echo "queue state unchanged"
            exit 0
          fi
          git commit -m "chore(content): publish job [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "queue state committed on attempt $attempt"
              exit 0
            fi
            echo "::warning::push rejected (attempt $attempt); rebasing onto main and retrying"
            git pull --rebase --autostash origin main || true
            sleep $((attempt * 5))
          done
          echo "::error title=Queue state lost::could not commit the published/ move; the next run may re-upload the same video"
          exit 1

      # Style proof without a 1 GB download: three frames from the master,
      # small enough to open from the run page. Shows HUD, typography,
      # gold illumination and how the plate fills a 16:9 frame.
      - name: Extract style frames from the master
        if: always()
        run: |
          set +e
          mkdir -p output/style-frames
          for f in output/*/*.mp4; do
            [ -f "$f" ] || continue
            specs=$(ffmpeg -hide_banner -i "$f" 2>&1 | grep -E 'Duration|Stream #' | tr -s ' ' | tr '\n' '/')
            echo "::notice title=Master::$(basename "$f") | $specs"
            for pct in 10 50 90; do
              ffmpeg -y -loglevel error -ss "$pct%" -i "$f" -frames:v 1 \
                -vf "scale=960:-2" "output/style-frames/$(basename "$f" .mp4)-${pct}pct.png"
            done
          done
          ls -la output/style-frames || true

      - name: Upload style frames (review artifact, 14 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: style-frames-${{ github.run_id }}
          path: output/style-frames/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload render for QC (expires in 1 day — videos never live in git)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ github.run_id }}
          path: output/
          retention-days: 1
