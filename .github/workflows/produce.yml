name: Produce video

# LIVE PRODUCTION WORKFLOW — Executes scheduled publishing to YouTube.
# NOTE: To prevent accidental, unintentional, or duplicate uploads from git commits,
# production uploads only run on the official release cron schedule or manual dispatch.
on:
  schedule:
    # Daily release slots:
    # 1. 06:14 UTC — Morning scripture devotional (07:14 WAT)
    # 2. 14:14 UTC — US afternoon / transatlantic priming (15:14 WAT / 10:14 EST)
    # 3. 19:14 UTC — Peak evening bedtime prayer sanctuary (20:14 WAT / 8:14pm local)
    - cron: "14 6 * * *"
    - cron: "14 14 * * *"
    - cron: "14 19 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Specific script file in content/queue/ (blank = next approved)"
        required: false
        default: ""
      short:
        description: "Authored 9:16 Short key to render & upload (e.g. short-enron)"
        required: false
        default: ""
      dry_run:
        description: "Render only, skip upload"
        type: boolean
        default: false

permissions:
  contents: write        # move queue file / record published receipt in content/published/
  issues: write          # release tickets

concurrency:
  group: produce
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest     # public repo: 4-core/16GB, free & unlimited
    timeout-minutes: 120
    env:
      DRY_RUN: ${{ (inputs.dry_run || false) && '1' || '0' }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
      AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH || 'true' }}
      DEFAULT_PRIVACY: "public"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # pipeline.run shells out to `gh issue create` for the release ticket
      # (SETUP.md §6.4). gh needs a token: without GH_TOKEN the call fails
      # unauthenticated and the QC issue would silently never appear.
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Python deps first, then a bounded best-effort apt ffmpeg + fonts. See the
      # action's header for the 2026-10-23 job-timeout this replaces.
      - uses: ./.github/actions/setup-render-deps

      - name: Restore stock-asset cache
        uses: actions/cache@v4
        with:
          path: output/asset_cache
          key: assets-${{ hashFiles('content/queue/*.md', 'tools/shorts.py') }}
          restore-keys: |
            assets-

      - name: Render and upload target edition
        run: |
          set +e
          if [ -n "${{ inputs.short }}" ]; then
            python -m pipeline.short_release --short "${{ inputs.short }}" 2>&1 | tee run.log
            rc=${PIPESTATUS[0]}
          elif [ -n "${{ inputs.job }}" ]; then
            python -m pipeline.run --job "content/queue/${{ inputs.job }}" 2>&1 | tee run.log
            rc=${PIPESTATUS[0]}
          else
            python -m pipeline.short_release --next 2>&1 | tee run.log
            python -m pipeline.run --next 2>&1 | tee -a run.log
            rc=${PIPESTATUS[0]}
          fi
          set -e
          echo "### Pipeline Log (exit $rc)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat run.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            tail -n 15 run.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

      - name: Commit queue state (job moved to published/)
        run: |
          git config user.name "youtube-automation-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A content/
          if ! git diff --cached --quiet; then
            git commit -m "chore(content): publish job [skip ci]"
            git push
          fi

      - name: Upload render for QC (expires in 1 day — videos never live in git)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ github.run_id }}
          path: output/
          retention-days: 1
