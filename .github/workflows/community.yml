name: Autonomous Community Tab Automation

on:
  schedule:
    # Executes twice weekly:
    # 1. Wednesdays at 19:14 UTC (8:14pm local) — Midweek Prayer Wall & Intercession
    # 2. Sundays at 19:14 UTC (8:14pm local) — Sunday Evening Thanksgiving & Scripture Poll
    - cron: '14 19 * * 0,3'   # 8:14pm Sunday and Wednesday, Nigeria time
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target channel id (secret-place, prayer2, prayer3, prayer4, prayer5, prayer6, prayer7, prayer8; blank = all scheduled channels)'
        type: string
        required: false
        default: ''
      dry_run:
        description: 'Simulate without posting'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: community-automation
  cancel-in-progress: false

jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # YouTube's Data API has no endpoint for creating Community posts, so this
      # cannot post by itself. It prepares the exact card and copy for every
      # scheduled channel (or the requested channel) so the human can paste into Studio.
      - name: Prepare today's post for manual publishing
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRAYER2_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER2_YOUTUBE_CLIENT_ID }}
          PRAYER2_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER2_YOUTUBE_CLIENT_SECRET }}
          PRAYER2_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER2_YOUTUBE_REFRESH_TOKEN }}
          PRAYER3_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER3_YOUTUBE_CLIENT_ID }}
          PRAYER3_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER3_YOUTUBE_CLIENT_SECRET }}
          PRAYER3_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER3_YOUTUBE_REFRESH_TOKEN }}
          PRAYER4_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER4_YOUTUBE_CLIENT_ID }}
          PRAYER4_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER4_YOUTUBE_CLIENT_SECRET }}
          PRAYER4_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER4_YOUTUBE_REFRESH_TOKEN }}
          PRAYER5_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER5_YOUTUBE_CLIENT_ID }}
          PRAYER5_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER5_YOUTUBE_CLIENT_SECRET }}
          PRAYER5_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER5_YOUTUBE_REFRESH_TOKEN }}
          PRAYER6_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER6_YOUTUBE_CLIENT_ID }}
          PRAYER6_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER6_YOUTUBE_CLIENT_SECRET }}
          PRAYER6_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER6_YOUTUBE_REFRESH_TOKEN }}
          PRAYER7_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER7_YOUTUBE_CLIENT_ID }}
          PRAYER7_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER7_YOUTUBE_CLIENT_SECRET }}
          PRAYER7_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER7_YOUTUBE_REFRESH_TOKEN }}
          PRAYER8_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER8_YOUTUBE_CLIENT_ID }}
          PRAYER8_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER8_YOUTUBE_CLIENT_SECRET }}
          PRAYER8_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER8_YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -n "$INPUT_CHANNEL" ]; then
            python scripts/post_community.py --publish --channel "$INPUT_CHANNEL"
          else
            python scripts/post_community.py --publish --all-channels
          fi
          python - <<'PY'
          import glob, pathlib
          packs = sorted(glob.glob('content/community/*-READY.md'))
          if not packs:
              raise SystemExit('no READY pack was written')
          for p in packs:
              pack = pathlib.Path(p)
              body = pack.read_text(encoding='utf-8')
              print(f'::notice title=Community post ready ({pack.name})::'
                    'YouTube has no API for Community posts. Open Studio -> Create -> Post, '
                    'attach the card, paste the copy. The full text is in the artifact and '
                    'in content/community/')
              print(body)
          PY

      - name: Upload the ready-to-post pack
        uses: actions/upload-artifact@v4
        with:
          name: community-post-${{ github.run_id }}
          path: |
            content/community/*-READY.md
            content/community/*.png
          retention-days: 21

      - name: Commit Generated Community Cards
        run: |
          mkdir -p /tmp/community-out
          git status --porcelain content/community/ | while read -r _st path; do
            if [ -f "$path" ]; then
              cp "$path" "/tmp/community-out/$(basename "$path")"
            fi
          done
          if [ -z "$(ls -A /tmp/community-out 2>/dev/null)" ]; then
            echo "Community cards unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --mixed origin/main
            mkdir -p content/community
            for f in /tmp/community-out/*; do
              cp "$f" "content/community/$(basename "$f")"
              git add "content/community/$(basename "$f")"
            done
            if git diff --cached --quiet; then
              echo "Community cards already up to date on main."
              exit 0
            fi
            git commit --quiet -m "chore(community): update community tab cards and manifests [skip ci]"
            if git push --quiet origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::warning::could not push community cards after 3 attempts; artifact is still uploaded"
