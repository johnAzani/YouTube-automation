name: Autonomous Community Tab Automation

on:
  schedule:
    # Executes twice weekly:
    # 1. Wednesdays at 19:14 UTC (8:14pm local) — Midweek Prayer Wall & Intercession
    # 2. Sundays at 19:14 UTC (8:14pm local) — Sunday Evening Thanksgiving & Scripture Poll
    - cron: '14 19 * * 0,3'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without posting'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: community-automation
  cancel-in-progress: false

jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Stage & Publish Community Post
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "Executing Community Tab Autopilot..."
          python scripts/post_community.py --publish

      - name: Commit Generated Community Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/community/
          git diff --staged --quiet || git commit -m "chore(community): update community tab cards and manifests [skip ci]"
          git push
