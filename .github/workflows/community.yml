name: Autonomous Community Tab Automation

on:
  schedule:
    # Executes twice weekly:
    # 1. Wednesdays at 19:14 UTC (8:14pm local) — Midweek Prayer Wall & Intercession
    # 2. Sundays at 19:14 UTC (8:14pm local) — Sunday Evening Thanksgiving & Scripture Poll
    - cron: '14 19 * * 0,3'   # 8:14pm Sunday and Wednesday, Nigeria time
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulate without posting'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: community-automation
  cancel-in-progress: false

jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # YouTube's Data API has no endpoint for creating Community posts, so this
      # cannot post by itself. It prepares the exact card and copy for the human to
      # paste into Studio, and says so on the run page instead of reporting success.
      - name: Prepare today's post for manual publishing
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/post_community.py --publish
          python - <<'PY'
          import glob, pathlib
          packs = sorted(glob.glob('content/community/*-READY.md'))
          if not packs:
              raise SystemExit('no READY pack was written')
          pack = pathlib.Path(packs[0])
          body = pack.read_text(encoding='utf-8')
          print(f'::notice title=Community post ready ({pack.name})::'
                'YouTube has no API for Community posts. Open Studio -> Create -> Post, '
                'attach the card, paste the copy. The full text is in the artifact and '
                'in content/community/')
          print(body)
          PY

      - name: Upload the ready-to-post pack
        uses: actions/upload-artifact@v4
        with:
          name: community-post-${{ github.run_id }}
          path: |
            content/community/*-READY.md
            content/community/*.png
          retention-days: 21

      - name: Commit Generated Community Cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/community/
          git diff --staged --quiet || git commit -m "chore(community): update community tab cards and manifests [skip ci]"
          git push
