# Every automation, watched continuously — not when the owner asks.
#
# Three separate rounds of "is X working?" all ended the same way: no, and nothing
# said so. A green tick is not evidence. This job checks, every three hours:
#
#   * every scheduled workflow actually ran, inside its own cron window;
#   * its last run succeeded (or was changed since it failed — then it is untested);
#   * the run left a trace (a publish, a reply, a queued script, a ready post);
#   * the channel is still uploading.
#
# It then updates ONE issue (scripts/pipeline_watchdog.py) and closes it on the
# first fully healthy check, so a stall reaches the owner without him asking.
name: Automation monitor

# Triggers, not just logic. On 2 November this workflow's 06:23, 09:23 and 12:23
# UTC slots produced *no runs at all* — the monitor had never executed since it was
# merged, so the one thing built to notice a stall was itself stalled. The brain's
# 03:14 slot did eventually start at 11:02, nearly eight hours late, which says the
# scheduler is not dropping runs so much as queueing them unpredictably.
#
# A monitor that only runs on a schedule inherits the schedule's unreliability, so
# it also runs on every push to main and every time CI or a production run finishes
# — the moments when there is something new to judge.
on:
  schedule:
    # Every three hours. :23 past, so it lands between release slots and after the
    # 4:14am brain pass rather than competing with it.
    - cron: "23 */3 * * *"
  push:
    branches: [main]
  workflow_run:
    workflows:
      - "Produce video"
      - "Dry-run pipeline (CI proof)"
    # NOT "Scheduler supervisor". The supervisor already triggers on *this* workflow
    # completing ("each completion is a chance to notice that something else did
    # not"), so listing it here made the pair trigger each other forever: from 09:42
    # to 09:54 on 6 November the two alternated roughly once a minute — 40+ runs,
    # each writing a commit and auditing the channel, while the brain run dispatched
    # at 09:34Z sat `queued` for over an hour behind them. A watcher must not be
    # woken by the watcher it wakes.
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: read        # run history is the evidence; reading it is the whole job

# Shared with production and the supervisor: all three commit into content/.
# Never share the publish lock. On 2 November a wedged produce run held
# `content-state` for hours, so this watcher queued behind the exact run it was
# supposed to notice — the failure it exists to catch, from the inside. A watcher
# that can be blocked by what it watches is not a watcher.
concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    # Depth guard: run at most one hop away from a real trigger. `workflow_run.event`
    # is the event that started the *completed* run, so this refuses a chain of
    # "a run that was itself started by a run finished". The accidental monitor <-> 
    # supervisor ping-pong of 6 November would have stopped at the second hop even
    # with both triggers still in place.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # the monitor dates workflow edits against their runs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Python deps
        run: pip install -r requirements.txt

      - name: Sync live channel thumbnails
        # EVERY channel, each with its own token (`--all-channels`). This step was
        # single-channel and it trusted `thumbnail_revision`, so a video whose
        # custom thumbnail YouTube refused at upload time — refused silently, by
        # a bare except in pipeline/upload.py — was never retried and never
        # mentioned. Receipts now say `thumbnail_pending` until the thumbnail is
        # really live, and this pass repairs every scheduled channel.
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID }}
          PRAYER2_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER2_YOUTUBE_CLIENT_ID }}
          PRAYER2_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER2_YOUTUBE_CLIENT_SECRET }}
          PRAYER2_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER2_YOUTUBE_REFRESH_TOKEN }}
          PRAYER2_YOUTUBE_CHANNEL_ID: ${{ vars.PRAYER2_YOUTUBE_CHANNEL_ID || secrets.PRAYER2_YOUTUBE_CHANNEL_ID }}
          PRAYER3_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER3_YOUTUBE_CLIENT_ID }}
          PRAYER3_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER3_YOUTUBE_CLIENT_SECRET }}
          PRAYER3_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER3_YOUTUBE_REFRESH_TOKEN }}
          PRAYER3_YOUTUBE_CHANNEL_ID: ${{ vars.PRAYER3_YOUTUBE_CHANNEL_ID || secrets.PRAYER3_YOUTUBE_CHANNEL_ID }}
          PRAYER4_YOUTUBE_CLIENT_ID: ${{ secrets.PRAYER4_YOUTUBE_CLIENT_ID }}
          PRAYER4_YOUTUBE_CLIENT_SECRET: ${{ secrets.PRAYER4_YOUTUBE_CLIENT_SECRET }}
          PRAYER4_YOUTUBE_REFRESH_TOKEN: ${{ secrets.PRAYER4_YOUTUBE_REFRESH_TOKEN }}
          PRAYER4_YOUTUBE_CHANNEL_ID: ${{ vars.PRAYER4_YOUTUBE_CHANNEL_ID || secrets.PRAYER4_YOUTUBE_CHANNEL_ID }}
        run: |
          python -m scripts.sync_published_thumbnails --all-channels
          python -m scripts.retrofit_published_metadata --sync-pending
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" python -m scripts.release_report --sweep-stale || true

      - name: Audit every automation and its outcome
        id: audit
        # This step exits 1 *because* something is failing — that is the alarm, and
        # the job ends red on purpose. But the next step files the issue, and it had
        # no `always()`, so on 2 November the monitor raised the alarm and then
        # skipped the step that would have told anyone: the only trace was a red X
        # with "exit code 1". The alarm and its reporting must not be in series.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRAYER2_GEMINI_API_KEY: ${{ secrets.PRAYER2_GEMINI_API_KEY }}
          PRAYER3_GEMINI_API_KEY: ${{ secrets.PRAYER3_GEMINI_API_KEY }}
          PRAYER4_GEMINI_API_KEY: ${{ secrets.PRAYER4_GEMINI_API_KEY }}
          EXPECT_BRAIN_API: "1"
        run: python -m scripts.automation_monitor --save

      - name: File or close the stall issue
        if: ${{ always() && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRAYER2_GEMINI_API_KEY: ${{ secrets.PRAYER2_GEMINI_API_KEY }}
          PRAYER3_GEMINI_API_KEY: ${{ secrets.PRAYER3_GEMINI_API_KEY }}
          PRAYER4_GEMINI_API_KEY: ${{ secrets.PRAYER4_GEMINI_API_KEY }}
          EXPECT_BRAIN_API: "1"
        run: python -m scripts.pipeline_watchdog

      - name: Commit the monitor snapshot
        # A dated record of what was wrong and when, so a recurring fault is visible
        # instead of being rediscovered every few days.
        #
        # Re-point at the current main first and commit on top of it. The old
        # `git pull --rebase --autostash` hit the same content conflict on all five
        # attempts during the 2 November release and could never win.
        if: ${{ always() && !cancelled() }}
        run: |
          set -e
          git config user.name "automation-monitor"
          git config user.email "actions@users.noreply.github.com"
          # Preserve only the published-receipt edits this run's sync steps
          # actually made. A run that checked out before a receipt changed
          # on main otherwise carries the stale file in its working tree:
          # `git reset --mixed` does not touch tracked files, so a blanket
          # `git add content/published/*.md` below would re-stage the old
          # receipt over the corrected one. That is how the retired
          # R8mVvedhYVw receipt kept coming back after PR #268 corrected it
          # to _vp27ZYPYaY. Start from main's receipts, then re-apply only
          # this run's own edits to receipts that still exist on main.
          sync_dir="$(mktemp -d)"
          git diff --name-only -z -- content/published/ > "$sync_dir/files.z"
          git ls-files --others --exclude-standard -z -- content/published/ >> "$sync_dir/files.z"
          while IFS= read -r -d '' path; do
            mkdir -p "$sync_dir/$(dirname "$path")"
            cp -- "$path" "$sync_dir/$path"
          done < "$sync_dir/files.z"
          git fetch --quiet origin main
          git reset --mixed origin/main
          git restore --source=origin/main --staged --worktree -- content/published/
          git clean -f content/published/
          while IFS= read -r -d '' path; do
            if git cat-file -e "origin/main:$path" 2>/dev/null; then
              cp -- "$sync_dir/$path" "$path"
            fi
          done < "$sync_dir/files.z"
          git restore --source=origin/main --staged --worktree -- content/queue/ content/shorts-queue/ docs/network-state.json 2>/dev/null || true
          python -m scripts.build_dashboard_data || true
          if [ -f content/monitor/status.json ]; then
            git add content/monitor/status.json
          fi
          if [ -f docs/network-state.json ]; then
            git add docs/network-state.json
          fi
          git add content/published/*.md
          if git diff --cached --quiet; then
            echo "snapshot unchanged"
            exit 0
          fi
          git commit --quiet -m "chore(monitor): automation status snapshot & live thumbnail sync [skip ci]"
          git push --quiet origin HEAD:main \
            || echo "::warning::could not push the snapshot; the issue is the record of truth"

      - name: Fail the job if the audit found a stalled automation
        # The alarm stays an alarm: the issue is filed, the snapshot is committed,
        # and only then does the run go red.
        if: ${{ always() && !cancelled() && steps.audit.outcome == 'failure' }}
        run: |
          echo "::error title=An automation is failing::see the filed issue for the per-workflow verdicts"
          exit 1

