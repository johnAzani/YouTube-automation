name: Autonomous Comment Replies

on:
  schedule:
    # 3-Pulse Comment Engagement Cadence ($0.00 Cost Lock):
    # 1. 07:14 UTC (8:14am local)  — Morning release +1hr First-Hour Velocity pulse
    # 2. 15:14 UTC (4:14pm local)  — Afternoon release +1hr global priming pulse
    # 3. 19:14 UTC (8:14pm local)  — Bedtime sanctuary & evening prayer sweep
    - cron: '14 7 * * *'    # 8:14am Nigeria time
    - cron: '14 15 * * *'   # 4:14pm Nigeria time
    - cron: '14 19 * * *'   # 8:14pm Nigeria time
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum comments to reply to per pulse (default 8, max 25)'
        required: false
        default: '8'
      video_id:
        description: 'Target specific YouTube video ID (leave blank for all channel videos)'
        required: false
        default: ''
      dry_run:
        description: 'Simulate without posting to YouTube'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: comments-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Comment Reply Engine
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # The engine files one issue when a viewer discloses distress instead of
          # answering them in public. Without a token that escalation is a log line.
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ github.event.inputs.limit || '10' }}
          VIDEO_ID: ${{ github.event.inputs.video_id || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          # pipefail matters here: the script writes a summary and exits non-zero
          # when it could not list comments. Without this, `| tee` would swallow
          # that and the run would go green having replied to nothing.
          set -o pipefail
          ARGS="--limit $LIMIT"
          if [ -n "$VIDEO_ID" ]; then
            ARGS="$ARGS --video-id $VIDEO_ID"
          fi
          if [ -n "$DRY_RUN" ]; then
            ARGS="$ARGS $DRY_RUN"
          else
            ARGS="$ARGS --apply"
          fi
          echo "Executing: python scripts/reply_comments.py $ARGS"
          python scripts/reply_comments.py $ARGS 2>&1 | tee reply.log

      - name: Commit replied comments ledger
        # Always: a reply that was posted must be recorded even if a later comment
        # failed, or the next pulse replies to the same person again.
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "content/comments/replied.json" ]; then
            git add content/comments/replied.json
            if git diff --staged --quiet; then
              echo "ledger unchanged"
            else
              git commit -m "chore(comments): record replied comment IDs [skip ci]"
              # Another workflow may have pushed while this one was replying.
              git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
              git push
            fi
          fi
