name: Autonomous Comment Replies

# Who this answers for. Until 2026-11-07 the scheduled run was hardcoded to
# The Secret Place: prayer2 and prayer3 were offered in the manual channel picker
# and never touched by a cron, so two of the three channels had no comment
# coverage at all — their viewers' prayer requests sat unanswered while this
# workflow reported success three times a day. The plan job below expands a
# scheduled run to every channel whose credentials exist, exactly like produce.yml.
on:
  schedule:
    # 3-Pulse Comment Engagement Cadence ($0.00 Cost Lock):
    # 1. 07:14 UTC (8:14am local)  — Morning release +1hr First-Hour Velocity pulse
    # 2. 15:14 UTC (4:14pm local)  — Afternoon release +1hr global priming pulse
    # 3. 19:14 UTC (8:14pm local)  — Bedtime sanctuary & evening prayer sweep
    - cron: '14 7 * * *'    # 8:14am Nigeria time
    - cron: '14 15 * * *'   # 4:14pm Nigeria time
    - cron: '14 19 * * *'   # 8:14pm Nigeria time
  workflow_dispatch:
    inputs:
      channel:
        description: 'Target channel (own GCP project & secrets)'
        type: choice
        options: [secret-place, prayer2, prayer3, prayer4, prayer5, prayer6]
        default: secret-place
      limit:
        description: 'Maximum comments to reply to per pulse (default 8, max 25)'
        required: false
        default: '8'
      pages:
        description: 'Pages of comment threads to walk (default 3, 100 threads each)'
        required: false
        default: '3'
      video_id:
        description: 'Target specific YouTube video ID (leave blank for all channel videos)'
        required: false
        default: ''
      dry_run:
        description: 'Simulate without posting to YouTube'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: comments-reply
  cancel-in-progress: false

jobs:
  plan:
    # A channel is answered on the schedule the moment its own refresh token
    # exists — readiness probe, not a feature flag. Same doctrine as produce.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      channels: ${{ steps.plan.outputs.channels }}
    steps:
      - id: plan
        env:
          PRAYER2_READY: ${{ secrets.PRAYER2_YOUTUBE_REFRESH_TOKEN != '' }}
          PRAYER3_READY: ${{ secrets.PRAYER3_YOUTUBE_REFRESH_TOKEN != '' }}
          PRAYER4_READY: ${{ secrets.PRAYER4_YOUTUBE_REFRESH_TOKEN != '' }}
          PRAYER5_READY: ${{ secrets.PRAYER5_YOUTUBE_REFRESH_TOKEN != '' }}
          PRAYER6_READY: ${{ secrets.PRAYER6_YOUTUBE_REFRESH_TOKEN != '' }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          python3 - <<'PY'
          import json, os
          event = os.environ.get("EVENT_NAME", "")
          if event == "schedule":
              channels = ["secret-place"]
              if os.environ.get("PRAYER2_READY", "").lower() == "true":
                  channels.append("prayer2")
              if os.environ.get("PRAYER3_READY", "").lower() == "true":
                  channels.append("prayer3")
              else:
                  print("::notice title=prayer3 comment replies wait for credentials::PRAYER3_YOUTUBE_REFRESH_TOKEN is not set, so The Midday Watch is not scheduled for replies yet.")
              if os.environ.get("PRAYER4_READY", "").lower() == "true":
                  channels.append("prayer4")
              else:
                  print("::notice title=prayer4 comment replies wait for credentials::PRAYER4_YOUTUBE_REFRESH_TOKEN is not set, so The Midnight Watch is not scheduled for replies yet.")
              if os.environ.get("PRAYER5_READY", "").lower() == "true":
                  channels.append("prayer5")
              else:
                  print("::notice title=prayer5 comment replies wait for credentials::PRAYER5_YOUTUBE_REFRESH_TOKEN is not set, so The Family Altar is not scheduled for replies yet.")
              if os.environ.get("PRAYER6_READY", "").lower() == "true":
                  channels.append("prayer6")
              else:
                  print("::notice title=prayer6 comment replies wait for credentials::PRAYER6_YOUTUBE_REFRESH_TOKEN is not set, so The Healing Balm is not scheduled for replies yet.")
          elif event == "workflow_dispatch":
              channels = [(os.environ.get("INPUT_CHANNEL") or "secret-place").strip()]
          else:
              channels = ["secret-place"]
          payload = json.dumps(channels)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"channels={payload}\n")
          print(f"replying for: {payload}")
          PY

  reply:
    needs: plan
    # One channel at a time: every leg commits the same
    # content/comments/replied.json to main.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJSON(needs.plan.outputs.channels) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Comment Reply Engine
        env:
          CHANNEL_ID: ${{ matrix.channel }}
          YOUTUBE_CLIENT_ID: ${{ matrix.channel == 'prayer6' && secrets.PRAYER6_YOUTUBE_CLIENT_ID || (matrix.channel == 'prayer5' && secrets.PRAYER5_YOUTUBE_CLIENT_ID || (matrix.channel == 'prayer4' && secrets.PRAYER4_YOUTUBE_CLIENT_ID || (matrix.channel == 'prayer3' && secrets.PRAYER3_YOUTUBE_CLIENT_ID || (matrix.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID)))) }}
          YOUTUBE_CLIENT_SECRET: ${{ matrix.channel == 'prayer6' && secrets.PRAYER6_YOUTUBE_CLIENT_SECRET || (matrix.channel == 'prayer5' && secrets.PRAYER5_YOUTUBE_CLIENT_SECRET || (matrix.channel == 'prayer4' && secrets.PRAYER4_YOUTUBE_CLIENT_SECRET || (matrix.channel == 'prayer3' && secrets.PRAYER3_YOUTUBE_CLIENT_SECRET || (matrix.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET)))) }}
          YOUTUBE_REFRESH_TOKEN: ${{ matrix.channel == 'prayer6' && secrets.PRAYER6_YOUTUBE_REFRESH_TOKEN || (matrix.channel == 'prayer5' && secrets.PRAYER5_YOUTUBE_REFRESH_TOKEN || (matrix.channel == 'prayer4' && secrets.PRAYER4_YOUTUBE_REFRESH_TOKEN || (matrix.channel == 'prayer3' && secrets.PRAYER3_YOUTUBE_REFRESH_TOKEN || (matrix.channel == 'prayer2' && secrets.PRAYER2_YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN)))) }}
          YOUTUBE_EXPECTED_CHANNEL_ID: ${{ matrix.channel == 'prayer6' && (vars.PRAYER6_YOUTUBE_CHANNEL_ID || secrets.PRAYER6_YOUTUBE_CHANNEL_ID) || (matrix.channel == 'prayer5' && (vars.PRAYER5_YOUTUBE_CHANNEL_ID || secrets.PRAYER5_YOUTUBE_CHANNEL_ID) || (matrix.channel == 'prayer4' && (vars.PRAYER4_YOUTUBE_CHANNEL_ID || secrets.PRAYER4_YOUTUBE_CHANNEL_ID) || (matrix.channel == 'prayer3' && (vars.PRAYER3_YOUTUBE_CHANNEL_ID || secrets.PRAYER3_YOUTUBE_CHANNEL_ID) || (matrix.channel == 'prayer2' && (vars.PRAYER2_YOUTUBE_CHANNEL_ID || secrets.PRAYER2_YOUTUBE_CHANNEL_ID) || (vars.YOUTUBE_CHANNEL_ID || secrets.YOUTUBE_CHANNEL_ID))))) }}
          GEMINI_API_KEY: ${{ matrix.channel == 'prayer6' && secrets.PRAYER6_GEMINI_API_KEY || (matrix.channel == 'prayer5' && secrets.PRAYER5_GEMINI_API_KEY || (matrix.channel == 'prayer4' && secrets.PRAYER4_GEMINI_API_KEY || (matrix.channel == 'prayer3' && secrets.PRAYER3_GEMINI_API_KEY || (matrix.channel == 'prayer2' && secrets.PRAYER2_GEMINI_API_KEY || secrets.GEMINI_API_KEY)))) }}
          # The engine files one issue when a viewer discloses distress instead of
          # answering them in public. Without a token that escalation is a log line.
          GH_TOKEN: ${{ github.token }}
          LIMIT: ${{ github.event.inputs.limit || '8' }}
          PAGES: ${{ github.event.inputs.pages || '3' }}
          VIDEO_ID: ${{ github.event.inputs.video_id || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          # pipefail matters here: the script writes a summary and exits non-zero
          # when it could not list comments. Without this, `| tee` would swallow
          # that and the run would go green having replied to nothing.
          set -o pipefail
          ARGS="--limit $LIMIT --pages $PAGES"
          if [ -n "$VIDEO_ID" ]; then
            ARGS="$ARGS --video-id $VIDEO_ID"
          fi
          if [ -n "$DRY_RUN" ]; then
            ARGS="$ARGS $DRY_RUN"
          else
            ARGS="$ARGS --apply"
          fi
          echo "Executing: python scripts/reply_comments.py $ARGS (channel $CHANNEL_ID)"
          python scripts/reply_comments.py $ARGS 2>&1 | tee reply.log

      - name: Commit replied comments ledger
        # Always: a reply that was posted must be recorded even if a later comment
        # failed, or the next pulse replies to the same person again.
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f "content/comments/replied.json" ]; then
            git add content/comments/replied.json
            if git diff --staged --quiet; then
              echo "ledger unchanged"
            else
              git commit -m "chore(comments): record replied comment IDs [skip ci]"
              # Another workflow may have pushed while this one was replying.
              # One rebase is not enough when produce and the supervisor are both
              # writing content/ at the same time: retry before failing the run.
              for attempt in 1 2 3; do
                git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" && git push && break
                echo "push attempt $attempt lost the race; retrying"
                sleep 5
              done
            fi
          fi
